const subjOptions = cur => Object.keys(SUBJECTS).map(k => `<option value="${k}" ${k === cur ? 'selected' : ''}>${subjLabel(k)}</option>`).join('');
const topicsOf = (cfg, subj) => ((cfg && cfg.topicsBy && cfg.topicsBy[subj]) || (subj === 'bio' && cfg && cfg.topics) || []);
const subjChips = (cur, attr = 'data-subj') => `<div class="chips"><button class="chip ${!cur ? 'on' : ''}" ${attr}="">الكل</button>${Object.keys(SUBJECTS).map(k => `<button class="chip ${cur === k ? 'on' : ''}" ${attr}="${k}">${subjLabel(k)}</button>`).join('')}</div>`;
const LETTERS = ['أ', 'ب', 'ج', 'د', 'هـ'];
const qCount = e => e.qCount ?? (e.questions ? e.questions.length : 0);
const visibleTo = (e, group) => !(e.groups && e.groups.length) || e.groups.includes(group || '');
const grpOptions = (groups, cur) => `<option value="">بدون مجموعة</option>` + groups.map(g => `<option value="${esc(g)}" ${g === cur ? 'selected' : ''}>${esc(g)}</option>`).join('');
const splitLines = t => [...new Set(String(t).split('\n').map(s => s.trim().replace(/\s+/g, ' ')).filter(Boolean))];
function byTopic(questions, answers, keyAnswers) {
  const m = new Map();
  questions.forEach((q, i) => {
    if (!q.topic || q.type === 'essay') return;
    const o = m.get(q.topic) || { topic: q.topic, c: 0, t: 0 };
    o.t++; if (answers[i] === keyAnswers[i]) o.c++;
    m.set(q.topic, o);
  });
  return [...m.values()];
}
function mergeTopics(lists) {
  const m = new Map();
  lists.flat().forEach(x => { const o = m.get(x.topic) || { topic: x.topic, c: 0, t: 0 }; o.c += x.c; o.t += x.t; m.set(x.topic, o); });
  return [...m.values()].sort((a, b) => a.c / a.t - b.c / b.t);
}
const topicBars = list => list.map(x => {
  const p = Math.round(x.c / x.t * 100), col = p < 50 ? 'var(--bad)' : p < 75 ? 'var(--warn)' : 'var(--ok)';
  return `<div style="margin:10px 0"><div class="row"><span class="grow">${esc(x.topic)}</span><b style="color:${col}">${p}%</b><span class="muted" style="font-size:.8rem">(${x.c}/${x.t})</span></div><div class="meter"><i style="width:${p}%;background:${col}"></i></div></div>`;
}).join('');
/* ترقيم الأسئلة: السؤال اللي له أجزاء (cont) بيتحسب رقم واحد وأجزاؤه (١) (٢) ... */
function qNums(qs) {
  let n = 0, p = 0;
  const out = qs.map(q => { if (q.cont && n && !isEssay(q)) { p++; return { n, p }; } n++; p = 1; return { n, p }; });
  out.forEach((o, i) => { o.multi = o.p > 1 || !!(out[i + 1] && out[i + 1].n === o.n); });
  return out;
}
const partLbl = o => o.multi ? o.n + ' (' + o.p + ')' : String(o.n);
/* ===== الدرجات: لكل سؤال درجة (الافتراضي 1)، والمقالي بيتصحح يدويًا ===== */
const isEssay = q => !!q && q.type === 'essay';
const qPts = q => (q && +q.pts > 0) ? +q.pts : 1;
const fmtN = n => Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
function scoreOf(questions, answers, keyAns, grades) {
  let mcq = 0, mcqT = 0, es = 0, esT = 0, pending = false;
  questions.forEach((q, i) => {
    const p = qPts(q);
    if (isEssay(q)) { esT += p; const g = grades && grades[i]; if (typeof g === 'number') es += Math.min(p, Math.max(0, g)); else pending = true; }
    else { mcqT += p; if (answers[i] === keyAns[i]) mcq += p; }
  });
  return { mcq, mcqT, es, esT, total: mcqT + esT, score: mcq + es, pending };
}
/* مستند النتيجة اللي الطالب بيشوفها (بيتكتب بواسطة الدكتور أو بواسطة الطالب نفسه في النتيجة الفورية) */
function pubDoc(ex, r, keyAns, sc, show, now) {
  const qs = ex.questions;
  return { code: r.studentCode, examId: ex.id, examTitle: ex.title, subject: subjOf(ex), name: r.name,
    score: sc.pending ? sc.mcq : sc.score, total: sc.pending ? sc.mcqT : sc.total, pending: sc.pending, mcqScore: sc.mcq, mcqTotal: sc.mcqT, essayScore: sc.es, essayTotal: sc.esT,
    publishedAt: now, byTopic: byTopic(qs, r.answers, keyAns),
    items: show ? qs.map((q, i) => isEssay(q)
      ? { essay: true, text: q.text || 'سؤال مقالي', pts: qPts(q), got: (r.grades && typeof r.grades[i] === 'number') ? Math.min(qPts(q), r.grades[i]) : null }
      : { text: q.text || '', options: q.options, chosen: r.answers[i] ?? -1, correct: keyAns[i], topic: q.topic || '', pts: qPts(q), ...(q.letters ? { letters: true } : {}), ...(q.cont ? { cont: true } : {}) }) : null };
}
/* ملخص الأبواب مقسوم حسب المادة. rows: [{subject, topics:[{topic,c,t}]}] */
function topicsBySubject(rows) {
  return Object.keys(SUBJECTS).map(k => {
    const t = mergeTopics(rows.filter(r => subjOf(r) === k).map(r => r.topics || []));
    return t.length ? `<div class="card"><b>${subjLabel(k)}: المستوى في كل باب</b><p class="muted" style="margin:2px 0 0;font-size:.85rem">الأضعف فوق.</p>${topicBars(t)}</div>` : '';
  }).join('');
}

/* ========= الصور والملفات الكبيرة (تتقسم لأجزاء عشان حد 1 ميجا للمستند في Firestore) ========= */
const PACK_CHARS = 700000, BLOB_CHARS = 600000, MAX_FILE = 5 * 1024 * 1024;
const refOf = (k, j) => '@' + k + '.' + j;
const parseRef = s => { const m = /^@(\d+)\.(\d+)$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };
/* imgs: مصفوفة data URLs. بترجع {refs, packs}. لو الحجم صغير بتسيبهم جوه المستند نفسه */
function buildPacks(imgs) {
  const total = imgs.reduce((s, x) => s + (x ? x.length : 0), 0);
  if (total <= 300000) return { refs: imgs.slice(), packs: [] };
  const packs = [[]], refs = [];
  let size = 0;
  imgs.forEach(img => {
    if (!img) { refs.push(''); return; }
    if (size + img.length > PACK_CHARS && packs[packs.length - 1].length) { packs.push([]); size = 0; }
    refs.push(refOf(packs.length - 1, packs[packs.length - 1].length));
    packs[packs.length - 1].push(img); size += img.length;
  });
  return { refs, packs };
}
const chunkStr = (s, n = BLOB_CHARS) => { const a = []; for (let i = 0; i < s.length; i += n) a.push(s.slice(i, i + n)); return a; };

/* تحويل محتوى الامتحان لشكل موحد (الأسئلة العادية أو ورقة PDF + بابل شيت) */
function normContent(meta, c) {
  if (meta.type === 'bubble' || c.mode === 'bubble') {
    const n = c.n || 0, ch = c.choices || 4;
    const qs = Array.from({ length: n }, (_, i) => ({ text: '', image: '', options: LETTERS.slice(0, ch), letters: true, topic: (c.topics || [])[i] || '', pts: (c.pts || [])[i] || 1, ...((c.cont || [])[i] && i ? { cont: true } : {}) }));
    (c.essays || []).forEach((p, j) => qs.push({ type: 'essay', text: 'سؤال مقالي ' + (j + 1), image: '', options: [], topic: '', pts: p || 1 }));
    return { pages: c.pages || [], questions: qs };
  }
  return { pages: [], questions: c.questions || [] };
}
async function resolveImages(meta, nc) {
  const need = new Set();
  [...nc.pages, ...nc.questions.map(q => q.image)].forEach(r => { const p = parseRef(r); if (p) need.add(p[0]); });
  if (!need.size) return nc;
  const packs = {};
  await Promise.all([...need].map(async k => { const p = await S.store.getPack(meta.id + '_' + k); if (!p) throw new Error('صور الامتحان ناقصة. كلّم الدكتور.'); packs[k] = p.imgs; }));
  const fix = r => { const p = parseRef(r); return p ? packs[p[0]][p[1]] : r; };
  nc.pages = nc.pages.map(fix); nc.questions.forEach(q => { q.image = fix(q.image); });
  return nc;
}
async function loadExamContent(meta, withImages = true) {
  const nc = normContent(meta, await S.store.getContent(meta.id));
  return withImages ? resolveImages(meta, nc) : nc;
}

  async getSettings() { const d = await this.col('settings').doc('app').get(); return d.exists ? d.data() : {}; },
  setRegistration(open) { return this.col('settings').doc('app').set({ registrationOpen: !!open }, { merge: true }); },
  async getPending(code) { const d = await this.col('pending').doc(code).get(); return d.exists ? d.data() : null; },
  async listPending() { const s = await this.col('pending').get(); return s.docs.map(d => d.data()).sort((a, b) => a.createdAt - b.createdAt); },
  createPending(p) { return this.col('pending').doc(p.code).set(p); },
  rejectPending(code) { return this.col('pending').doc(code).delete(); },
  async approvePending(p) {
    const b = this.db.batch();
    b.set(this.col('students').doc(p.code), { code: p.code, name: p.name, group: p.group || '', createdAt: Date.now(), self: true });
    b.delete(this.col('pending').doc(p.code));
    await b.commit();
  },
  patchAttempt(id, o) { return this.col('attempts').doc(id).update(o); },
  async listAttempts(examId) {
    const s = await this.col('attempts').where('examId', '==', examId).get();
    return s.docs.map(d => { const x = d.data(); return { ...x, startedAt: x.startedAt && x.startedAt.toMillis ? x.startedAt.toMillis() : 0 }; });
  },
  async getAttempt(id) {
    const d = await this.col('attempts').doc(id).get(); if (!d.exists) return null;
    const x = d.data(); return { ...x, startedAt: x.startedAt && x.startedAt.toMillis ? x.startedAt.toMillis() : Date.now() };
  },
  async createAttempt(id, data) { await this.col('attempts').doc(id).set({ ...data, submitted: false, startedAt: firebase.firestore.FieldValue.serverTimestamp() }); return this.getAttempt(id); },
  async markSubmitted(id) { await this.col('attempts').doc(id).update({ submitted: true }); },
  async saveResult(r) { await this.col('results').doc(r.id).set(r); },
  async listResults(examId) { const s = await this.col('results').where('examId', '==', examId).get(); return s.docs.map(d => d.data()); },
  async deleteResult(r) {
    await this.col('results').doc(r.id).delete(); await this.col('attempts').doc(r.id).delete();
    if (r.studentCode) await this.col('students').doc(r.studentCode).collection('results').doc(r.examId).delete();
  },
  async publishFor(docs) { for (let i = 0; i < docs.length; i += 400) { const b = this.db.batch(); docs.slice(i, i + 400).forEach(x => b.set(this.col('students').doc(x.code).collection('results').doc(x.examId), x)); await b.commit(); } },
  async unpublish(examId, codes) { for (let i = 0; i < codes.length; i += 400) { const b = this.db.batch(); codes.slice(i, i + 400).forEach(c => b.delete(this.col('students').doc(c).collection('results').doc(examId))); await b.commit(); } },
  async listPublished(code) { const s = await this.col('students').doc(code).collection('results').get(); return s.docs.map(d => d.data()); },
  async listMaterials() { const s = await this.col('materials').orderBy('createdAt', 'desc').get(); return s.docs.map(d => d.data()); },
  async addMaterial(m, parts) {
    if (parts) for (let i = 0; i < parts.length; i += 4) { const b = this.db.batch(); parts.slice(i, i + 4).forEach((p, j) => b.set(this.col('blobParts').doc(m.id + '_' + (i + j)), { d: p })); await b.commit(); }
    await this.col('materials').doc(m.id).set(m);
  },
  async deleteMaterial(m) {
    await this.col('materials').doc(m.id).delete();
    for (let i = 0; i < (m.parts || 0); i++) { try { await this.col('blobParts').doc(m.id + '_' + i).delete(); } catch (e) {} }
    if (!m.parts && m.kind === 'file') { try { await this.col('materialFiles').doc(m.id).delete(); } catch (e) {} }
  },
  async getMaterialData(m) {
    if (m.parts) {
      const docs = await Promise.all(Array.from({ length: m.parts }, (_, k) => this.col('blobParts').doc(m.id + '_' + k).get()));
      if (docs.some(d => !d.exists)) return null;
      return 'data:' + (m.mime || 'application/octet-stream') + ';base64,' + docs.map(d => d.data().d).join('');
    }
    const d = await this.col('materialFiles').doc(m.id).get(); return d.exists ? d.data().data : null;
  }
};

/* ===== علامات "جديد" (نقطة حمراء) للطالب: بتختفي لما يفتح الصفحة ===== */
const seenKey = ses => 'seen_' + ses.code;
const getSeen = ses => { try { return JSON.parse(ls.get(seenKey(ses))) || null; } catch (e) { return null; } };
/* بيرجّع آخر وقت شافه الطالب في التبويب ده، وبيسجّل إنه شاف لحد stamp. أول مرة: كل القديم يعتبر متشاف */
function takeSeen(ses, tab, stamp) {
  const sn = getSeen(ses) || {}, prev = sn[tab] === undefined ? stamp : sn[tab];
  sn[tab] = Math.max(prev, stamp); ls.set(seenKey(ses), JSON.stringify(sn)); S.stampCache = null;
  return prev;
}
async function newStamps(ses) {
  const c = S.stampCache;
  if (c && c.code === ses.code && Date.now() - c.at < 45000) return c.v;
  const v = { exams: 0, files: 0, results: 0, rank: 0 };
  try {
    const [ex, mats, pubs, r1, r2] = await Promise.all([S.store.listActiveExams(), S.store.listMaterials(), S.store.listPublished(ses.code), S.store.getRank('bio'), S.store.getRank('geo')]);
    const grp = ses.group || '', now = Date.now();
    v.exams = Math.max(0, ...ex.filter(e => visibleTo(e, grp) && !(e.closesAt && now > e.closesAt)).map(e => e.createdAt || 0));
    v.files = Math.max(0, ...mats.map(m => m.updatedAt || m.createdAt || 0));
    v.results = Math.max(0, ...pubs.map(p => p.publishedAt || 0));
    v.rank = Math.max(0, (r1 && r1.updatedAt) || 0, (r2 && r2.updatedAt) || 0);
  } catch (e) { return c ? c.v : v; }
  S.stampCache = { code: ses.code, at: Date.now(), v }; return v;
}
async function refreshDots(tab) {
  const ses = getSession(); if (!ses || !$('.nav')) return;
  const v = await newStamps(ses), sn = getSeen(ses) || {};
  let changed = false;
  ['exams', 'files', 'results', 'rank'].forEach(t => { if (sn[t] === undefined) { sn[t] = v[t]; changed = true; } });
  if (changed) ls.set(seenKey(ses), JSON.stringify(sn));
  document.querySelectorAll('.nav a[data-t]').forEach(a => {
    const t = a.dataset.t, has = a.querySelector('.dot');
    if (t !== tab && v[t] > (sn[t] || 0)) { if (!has) a.insertAdjacentHTML('beforeend', '<span class="dot"></span>'); } else if (has) has.remove();
  });
}

async function studentRoute(p) {
  if (p[1] === 'register') return studentRegister();
  const ses = getSession();
  if (!ses) return studentLogin();
  try {
    if (p[1] === 'exam' && p[2]) return await startExam(p[2], ses);
    if (p[1] === 'rank') return await studentRank(ses);
    if (p[1] === 'results') return await studentResults(ses);
    if (p[1] === 'files') return await studentFiles();
    return await studentExams(ses);
  } catch (e) { studentShell('exams', `<div class="msg bad">${esc(e.message)}</div>`); }

async function studentExams(ses) {
  studentShell('exams', loadingInner);
  const st = await S.store.getStudent(ses.code);
  if (!st) { setSession(null); return studentLogin('الكود ده مش متسجل. كلّم الدكتور.'); }
  ses.name = st.name; ses.group = st.group || ''; setSession(ses);
  const all = (await S.store.listActiveExams()).filter(e => visibleTo(e, ses.group));
  const atts = await Promise.all(all.map(e => S.store.getAttempt(e.id + '_' + ses.code)));
  const subj = S.subjExams || '';
  const prevSeen = takeSeen(ses, 'exams', Math.max(0, ...all.map(e => e.createdAt || 0)));
  let pending = 0;
  const cards = [];
  all.forEach((e, i) => {
    const a = atts[i];
    const nowMs = Date.now(), tooLate = e.closesAt && nowMs > e.closesAt, tooEarly = e.opensAt && nowMs < e.opensAt;
    let badge = '<span class="badge">لسه ما بدأتش</span>', btn = `<button class="btn sm" data-start="${e.id}" data-new="1">ابدأ الامتحان</button>`;
    if (!a && tooLate) { badge = '<span class="badge bad">انتهى وقت الامتحان</span>'; btn = ''; }
    else if (!a && tooEarly) { badge = '<span class="badge warn">لسه ما فتحش</span>'; btn = ''; }
    if (a && a.submitted) { badge = '<span class="badge ok">تم التسليم ✓</span>'; btn = ''; }
    else {
      if (a || (!tooLate && !tooEarly)) pending++;
      if (a) {
        const left = e.durationMin * 60 - Math.floor((Date.now() - a.startedAt) / 1000);
        if (left > 0) { badge = `<span class="badge warn">جاري · باقي ${Math.ceil(left / 60)} د</span>`; btn = `<button class="btn sm" data-start="${e.id}">كمّل الامتحان</button>`; }
        else { badge = '<span class="badge warn">انتهى الوقت</span>'; btn = `<button class="btn sm" data-start="${e.id}">تسليم إجاباتك</button>`; }
      }
    }
    if (subj && subjOf(e) !== subj) return;
    cards.push(`<div class="card"><div class="row"><div class="grow"><b>${esc(e.title)}</b><div class="muted">${subjLabel(subjOf(e))} · ${qCount(e)} سؤال · ${e.durationMin} دقيقة</div>${e.opensAt || e.closesAt ? `<div class="muted" style="color:var(--warn)">⏰ ${e.opensAt ? 'بيفتح ' + fmtDate(e.opensAt) + ' ' : ''}${e.closesAt ? 'ومتاح لحد ' + fmtDate(e.closesAt) : ''}</div>` : ''}</div>${!(a && a.submitted) && e.createdAt > prevSeen ? '<span class="newb">جديد</span>' : ''}${badge}</div>${btn ? `<div style="margin-top:10px">${btn}</div>` : ''}</div>`);
  });
  studentShell('exams', `<div class="hero"><div>أهلاً</div><h1>${esc(ses.name)}</h1><div>${pending ? `عندك ${pending} امتحان مفتوح` : 'مفيش امتحانات مطلوبة دلوقتي'}</div></div>
  <h2>الامتحانات المتاحة</h2>${subjChips(subj)}${cards.join('') || '<div class="card muted">مفيش امتحانات مفتوحة دلوقتي.</div>'}`);
  $('#main').onclick = async e => {
    const c = e.target.closest('[data-subj]');
    if (c) { S.subjExams = c.dataset.subj; return studentExams(ses); }
    const b = e.target.closest('[data-start]'); if (!b) return;
    const ex = all.find(x => x.id === b.dataset.start);
    if (b.dataset.new && !(await modal({ title: 'بدء الامتحان', html: `<p style="margin:0">المؤقت هيبدأ فورًا ومدته <b>${ex.durationMin} دقيقة</b>.<br>أثناء الامتحان خروجك من الصفحة أو محاولة تصوير الشاشة بيتسجل وبيظهر للدكتور.</p>`, ok: 'ابدأ' }))) return;
    go('#s/exam/' + b.dataset.start);
  };
}

const draftKey = aid => 'draft_' + aid;
function loadDraft(aid, n) { try { const a = JSON.parse(ls.get(draftKey(aid))); if (Array.isArray(a) && a.length === n) return a; } catch (e) {} return Array(n).fill(-1); }
const saveDraft = (aid, a) => ls.set(draftKey(aid), JSON.stringify(a));

async function startExam(id, ses) {
  studentShell('exams', loadingInner);
  const meta = await S.store.getExam(id);
  if (!meta) throw new Error('الامتحان مش موجود');
  const aid = meta.id + '_' + ses.code;
  let att = await S.store.getAttempt(aid);
  if (att && att.submitted) throw new Error('انت سلّمت الامتحان ده قبل كده.');
  if (!att) {
    if (!meta.active) throw new Error('الامتحان مقفول دلوقتي');
    if (meta.opensAt && Date.now() < meta.opensAt) throw new Error('الامتحان لسه ما فتحش. بيفتح ' + fmtDate(meta.opensAt));
    if (meta.closesAt && Date.now() > meta.closesAt) throw new Error('انتهى وقت الامتحان (اتقفل ' + fmtDate(meta.closesAt) + ')');
    const st = await S.store.getStudent(ses.code);
    if (!st) { setSession(null); throw new Error('الكود ده مش متسجل. كلّم الدكتور.'); }
    ses.group = st.group || ''; setSession(ses);
    if (!visibleTo(meta, ses.group)) throw new Error('الامتحان ده مش متاح لمجموعتك.');
    att = await S.store.createAttempt(aid, { examId: meta.id, studentCode: ses.code, name: ses.name });
  }
  const nc = await loadExamContent(meta);
  const exam = { ...meta, questions: nc.questions, pages: nc.pages };
  const left = exam.durationMin * 60 - Math.floor((Date.now() - att.startedAt) / 1000);
  if (left <= 0) { await submitAnswers(exam, aid, ses, loadDraft(aid, exam.questions.length), loadEssay(aid)); return doneScreen(true, await finishInstant(exam, ses, loadDraft(aid, exam.questions.length)), ses); }
  runExam(exam, aid, ses, att.startedAt, att);
}

const essayKey = aid => 'essay_' + aid;
function loadEssay(aid) { try { return JSON.parse(ls.get(essayKey(aid))) || {}; } catch (e) { return {}; } }
const saveEssay = (aid, o) => ls.set(essayKey(aid), JSON.stringify(o));
/* ضغط صورة الحل المكتوب لحجم مناسب للتخزين */
async function compressTo(file, maxChars) {
  for (const [w, q] of [[1280, 0.62], [1100, 0.52], [900, 0.45], [720, 0.4]]) { const d = await compress(file, w, q); if (d.length <= maxChars) return d; }
  throw new Error('الصورة كبيرة جدًا');
}
async function submitAnswers(exam, aid, ses, answers, essay) {
  const es = {};
  Object.entries(essay || {}).forEach(([i, v]) => { if (v && (String(v.t || '').trim() || (v.imgs || []).length)) es[i] = { t: String(v.t || '').slice(0, 6000), imgs: v.imgs || [] }; });
  try { await S.store.saveResult({ id: aid, examId: exam.id, examTitle: exam.title, studentCode: ses.code, name: ses.name, answers, essay: es, submittedAt: Date.now() }); }
  catch (e) { if (!(e && e.code === 'permission-denied')) throw e; }
  try { await S.store.markSubmitted(aid); } catch (e) {}
  ls.del(draftKey(aid)); ls.del(essayKey(aid));
}
/* النتيجة الفورية: بعد التسليم الطالب بيقرا المفتاح (مسموح له بس بعد التسليم) ويحسب درجته */
async function finishInstant(exam, ses, answers) {
  if (exam.release !== 'instant') return null;
  try {
    await S.store.proveSubmit(exam.id, ses.code);
    const key = await S.store.getKey(exam.id); if (!key) return null;
    const sc = scoreOf(exam.questions, answers, key.answers, null);
    const doc = pubDoc(exam, { studentCode: ses.code, name: ses.name, answers, grades: null }, key.answers, sc, exam.showAnswers !== false, Date.now());
    await S.store.publishSelf(doc);
    return doc;
  } catch (e) { return null; }
}


/* علامة مائية: اسم الطالب وكوده مكررين على الشاشة كلها، عشان أي صورة تتسرب تتعرف */
/* حماية أثناء الامتحان: تسجيل الخروج من الصفحة وفقدان التركيز، حجب المحتوى، ومحاولات التصوير والنسخ.
   مهم: المتصفح مش بيقدر يمنع لقطة الشاشة فعليًا (خصوصًا من الموبايل)، ده ردع وتسجيل بس. */
function armSecurity(aid, a0) {
  let leaves = a0.leaves || 0, shots = a0.shots || 0, shorts = a0.short || 0, awaySec = a0.awaySec || 0, away = false, t0 = 0, tmr = null;
  const patch = o => S.store.patchAttempt(aid, o).catch(() => {});
  const cover = on => { const c = $('#cover'); if (c) c.classList.toggle('on', on); };
  const showLv = () => {
    const el = $('#lv'); if (!el) return;
    const parts = [];
    if (leaves) parts.push(`خروجك من الصفحة اتسجل ${leaves} مرة`);
    if (shots) parts.push(`محاولات التصوير: ${shots}`);
    el.textContent = parts.length ? '⚠ ' + parts.join(' · ') + ' وبيظهر للدكتور.' : 'ملحوظة: الخروج من صفحة الامتحان ومحاولة تصوير الشاشة بيتسجلوا وبيظهروا للدكتور.';
  };
  const goAway = () => { if (away) return; away = true; t0 = Date.now(); leaves++; patch({ leaves, lastLeave: Date.now(), away: true }); showLv(); };
  const back = () => { if (!away) return; away = false; const dur = Date.now() - t0; awaySec += Math.max(0, Math.round(dur / 1000)); if (dur < 3000) { shorts++; patch({ away: false, awaySec, short: shorts }); } else patch({ away: false, awaySec }); showLv(); };
  const check = () => {
    const out = document.hidden || !document.hasFocus();
    if (out) {
      cover(true);
      if (document.hidden) goAway();
      else { clearTimeout(tmr); tmr = setTimeout(() => { if (document.hidden || !document.hasFocus()) goAway(); }, 400); }
    } else { clearTimeout(tmr); cover(false); back(); }
  };
  const shot = () => {
    shots++; patch({ shots, lastLeave: Date.now() }); showLv();
    try { navigator.clipboard.writeText('الامتحان محمي. تم تسجيل المحاولة.').catch(() => {}); } catch (e) {}
  };
  const inTA = e => { const t = e.target && e.target.nodeType === 3 ? e.target.parentElement : e.target; return !!(t && t.closest && t.closest('textarea')); };
  const stop = e => { if (!inTA(e)) e.preventDefault(); };
  const onKeyDown = e => {
    const k = (e.key || '').toLowerCase();
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && ['3', '4', '5', 's'].includes(k)) { shot(); e.preventDefault(); }
    else if (inTA(e)) return;
    else if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'p', 's', 'u', 'a'].includes(k)) e.preventDefault();
    else if (k === 'f12' || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(k))) e.preventDefault();
  };
  const onKeyUp = e => { if (e.key === 'PrintScreen') { shot(); } };
  const ev = [[document, 'visibilitychange', check], [window, 'blur', check], [window, 'focus', check], [window, 'pagehide', check], [window, 'beforeprint', shot],
    [document, 'contextmenu', stop], [document, 'copy', stop], [document, 'cut', stop], [document, 'dragstart', stop], [document, 'selectstart', stop],
    [document, 'keydown', onKeyDown], [document, 'keyup', onKeyUp]];
  ev.forEach(([t, n, f]) => t.addEventListener(n, f));
  const iv = setInterval(check, 2000);
  showLv(); check();
  return () => { ev.forEach(([t, n, f]) => t.removeEventListener(n, f)); clearInterval(iv); clearTimeout(tmr); };
}

function runExam(exam, aid, ses, startedAt, att) {
  const bubble = exam.type === 'bubble';
  const r = rng(hashStr(aid)), idx = n => Array.from({ length: n }, (_, k) => k);
  const all = exam.questions.map((q, i) => ({ q, i }));
  const mcq = all.filter(o => !isEssay(o.q)), ess = all.filter(o => isEssay(o.q));
  const units = []; mcq.forEach(o => { if (o.q.cont && units.length) units[units.length - 1].push(o); else units.push([o]); });
  const shownU = exam.shuffle && !bubble ? shuffled(units, r) : units, shown = shownU.flat(), nums = qNums(mcq.map(o => o.q));
  shown.forEach(o => { o.order = exam.shuffle && !o.q.letters ? shuffled(idx(o.q.options.length), r) : idx(o.q.options.length); });
  const ans = loadDraft(aid, exam.questions.length), essay = loadEssay(aid), thumbs = {};
  ess.forEach(o => { if (!essay[o.i]) essay[o.i] = { t: '', imgs: [], k: 0 }; });
  const ptsTag = q => exam.showPts === false ? '' : `<span class="muted" style="font-size:.8rem;font-weight:400"> (${fmtN(qPts(q))} د)</span>`;
  const optsOf = o => o.q.letters
    ? `<div class="pills">${o.order.map(k => `<label class="pill"><input type="radio" name="q${o.i}" data-i="${o.i}" value="${k}" ${ans[o.i] === k ? 'checked' : ''}><span>${esc(o.q.options[k])}</span></label>`).join('')}</div>`
    : o.order.map(k => `<label class="opt"><input type="radio" name="q${o.i}" data-i="${o.i}" value="${k}" ${ans[o.i] === k ? 'checked' : ''}><span>${esc(o.q.options[k])}</span></label>`).join('');
  const qCard = (u, p) => { const o0 = u[0], multi = u.length > 1;
    return `<div class="card q"><div class="qh"><span class="qn">${p + 1}</span>${esc(o0.q.text)}${multi ? '' : ptsTag(o0.q)}</div>
    ${o0.q.image ? `<img class="zoomable" src="${esc(o0.q.image)}" alt=""><div class="muted" style="font-size:.8rem">اضغط على الصورة للتكبير</div>` : ''}
    ${u.map((o, j) => (multi ? `<div class="part"><b>الجزء (${j + 1})</b>${ptsTag(o.q)}</div>` : '') + optsOf(o)).join('')}</div>`; };
  const chips = i => essay[i].imgs.map((k, n) => { const id = aid + '_' + i + '_' + k; return `<span class="chipimg">${thumbs[id] ? `<img src="${thumbs[id]}" alt="">` : '📎'} صورة ${n + 1} ✓<button class="btn sm danger" data-esrm="${i}:${k}">×</button></span>`; }).join('');
  const essayCard = (o, p) => `<div class="card q essay"><div class="qh"><span class="qn">${p + 1}</span>${esc(o.q.text)} <span class="badge">${exam.showPts === false ? 'مقالي' : 'مقالي · ' + fmtN(qPts(o.q)) + ' درجة'}</span></div>
    ${o.q.image ? `<img class="zoomable" src="${esc(o.q.image)}" alt="">` : ''}
    <textarea data-es="${o.i}" placeholder="اكتب إجابتك هنا، أو ارفع صورة الحل المكتوب بخط اليد (أو الاتنين)">${esc(essay[o.i].t)}</textarea>
    <div class="row" style="margin-top:8px"><label class="btn sm ghost" style="margin:0">📷 رفع صورة الحل (حتى 3)<input type="file" accept="image/*" data-esimg="${o.i}" hidden></label><span class="muted" id="esst${o.i}"></span></div>
    <div class="row" id="esth${o.i}" style="margin-top:6px">${chips(o.i)}</div></div>`;
  const sheetRows = mcq.map(o => `<div class="brow ${ans[o.i] >= 0 ? 'done' : ''}" id="br${o.i}"><b>${partLbl(nums[mcq.indexOf(o)])}</b><div class="pills" style="margin:0;gap:6px">${o.q.options.map((l, k) => `<label class="pill sm"><input type="radio" name="q${o.i}" data-i="${o.i}" value="${k}" ${ans[o.i] === k ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div></div>`).join('');
  view(`<div class="xbar"><div class="xrow"><b>${esc(exam.title)}</b><span class="timer" id="tm">--:--</span></div><div class="prog"><i id="pg"></i></div></div>
  <div id="cover"><div><div class="big">🔒</div><h2>الأسئلة مخفية</h2><p class="muted">رجّع لصفحة الامتحان وكمّل. الخروج بيتسجل وبيظهر للدكتور.</p></div></div>
  <div class="wrap noselect pb2" id="ex"><p class="muted">${esc(ses.name)} · <span id="cnt"></span></p>
  <div class="msg warn" id="lv"></div>
  ${bubble ? `<div class="pgs">${exam.pages.map(p => `<img class="zoomable" src="${esc(p)}" alt="">`).join('')}</div>` : shownU.map(qCard).join('')}
  ${ess.map((o, k) => essayCard(o, units.length + k)).join('')}
  <div id="msg"></div><button class="btn block" id="fin" style="margin-bottom:${bubble ? 80 : 40}px">تسليم الإجابات</button></div>
  ${bubble ? `<button class="btn sheetbtn" id="shb">📝 ورقة الإجابة</button><div class="sheet noselect" id="sheet"><div class="sh row"><b class="grow">ورقة الإجابة</b><span class="muted" id="cnt2"></span></div>${sheetRows}</div>` : ''}`);
  const count = () => {
    const n = mcq.filter(o => ans[o.i] >= 0).length;
    $('#cnt').textContent = `اتجاوب ${n} من ${mcq.length}` + (ess.length ? ` · ${ess.length} مقالي` : ''); $('#pg').style.width = (mcq.length ? n / mcq.length * 100 : 0) + '%';
    const c2 = $('#cnt2'); if (c2) c2.textContent = `${n} / ${mcq.length}`;
  };
  count();
  $('#app').oninput = e => { const t = e.target; if (t.dataset.es !== undefined) { essay[+t.dataset.es].t = t.value; saveEssay(aid, essay); } };
  $('#app').onchange = async e => {
    const t = e.target;
    if (t.type === 'radio' && t.dataset.i !== undefined) {
      const i = +t.dataset.i; ans[i] = +t.value; saveDraft(aid, ans); count();
      document.querySelectorAll(`input[name="q${i}"]`).forEach(x => { x.checked = +x.value === ans[i]; });
      const br = $('#br' + i); if (br) br.classList.add('done');
    } else if (t.dataset.esimg !== undefined) {
      const i = +t.dataset.esimg, f = t.files[0], st = $('#esst' + i), en = essay[i]; t.value = '';
      if (!f) return;
      if (en.imgs.length >= 3) { st.textContent = 'الحد الأقصى 3 صور'; return; }
      st.textContent = 'جاري الرفع...';
      try {
        const d = await compressTo(f, 420000), k = en.k || 0, id = aid + '_' + i + '_' + k;
        await S.store.putEssayImg(id, d); en.k = k + 1; en.imgs.push(k); thumbs[id] = d; saveEssay(aid, essay);
        $('#esth' + i).innerHTML = chips(i); st.textContent = '';
      } catch (er) { st.textContent = 'تعذر رفع الصورة، اتأكد من النت وحاول تاني'; }
    }
  };
  $('#app').onclick = e => {
    const im = e.target.closest('img.zoomable'); if (im) return zoomImg(im.src);
    const rm = e.target.closest('[data-esrm]');
    if (rm) { const [i, k] = rm.dataset.esrm.split(':').map(Number); essay[i].imgs = essay[i].imgs.filter(x => x !== k); saveEssay(aid, essay); $('#esth' + i).innerHTML = chips(i); return; }
    const sb = e.target.closest('#shb');
    if (sb) { const o = $('#sheet').classList.toggle('open'); document.body.classList.toggle('sheet-open', o); sb.textContent = o ? '⬇ إخفاء ورقة الإجابة' : '📝 ورقة الإجابة'; }
  };
  let busy = false;
  const finish = async auto => {
    busy = true; const b = $('#fin'); b.disabled = true; setMsg('');
    try {
      await submitAnswers(exam, aid, ses, ans, essay);
      clearInterval(S.timer); if (S.cleanup) { S.cleanup(); S.cleanup = null; }
      doneScreen(auto, await finishInstant(exam, ses, ans), ses);
    }
    catch (e) { busy = false; b.disabled = false; setMsg('تعذر الإرسال، اتأكد من النت وإضغط تسليم تاني. إجاباتك محفوظة.'); }
  };
  const tick = () => {
    const left = exam.durationMin * 60 - Math.floor((Date.now() - startedAt) / 1000), l = Math.max(0, left), tm = $('#tm');
    if (!tm) return;
    tm.textContent = pad(Math.floor(l / 60)) + ':' + pad(l % 60); tm.classList.toggle('low', l <= 60);
    if (left <= 0 && !busy) finish(true);
  };
  S.timer = setInterval(tick, 1000); tick();
  S.cleanup = armSecurity(aid, att || {});
  $('#fin').onclick = async () => {
    const un = mcq.filter(o => ans[o.i] < 0).length, emp = ess.filter(o => !essay[o.i].t.trim() && !essay[o.i].imgs.length).length;
    const parts = []; if (un) parts.push(`لسه ${un} سؤال اختيار من غير إجابة`); if (emp) parts.push(`${emp} سؤال مقالي فاضي`);
    if (!(await modal({ title: 'تسليم الإجابات', text: parts.length ? parts.join(' و') + '. تسلّم برضه؟' : 'تسليم الإجابات؟', ok: 'سلّم' }))) return;
    finish(false);
  };
}

async function teacherRoute(p) {
  if (!S.store.isTeacher()) return teacherLogin();
  try {
    if (!p[1]) return await dashboard();
    if (p[1] === 'new') return await editor(null);
    if (p[1] === 'edit') return await editor(p[2]);
    if (p[1] === 'results') return await results(p[2]);
    if (p[1] === 'grade' && p[2] && p[3]) return await gradePage(p[2], p[3]);
    if (p[1] === 'students') return await teacherStudents();
    if (p[1] === 'student' && p[2]) return await teacherStudent(p[2]);
    if (p[1] === 'settings') return await teacherSettings();
    if (p[1] === 'files') return await teacherFiles();
    await dashboard();
  } catch (e) { teacherShell('exams', `<div class="msg bad">${esc(e.message)}</div>`); }
}

/* تعديل بيانات طالب (الاسم والكود والمجموعة). تغيير الكود مسموح بس لو الطالب لسه معندوش نتايج */
async function editStudent(s, groups, all, pend, preset) {
  const v = preset || { name: s.name, code: s.code, group: s.group || '' };
  const r = await modal({ title: 'تعديل الطالب', ok: 'حفظ', html: `<label>الاسم</label><input type="text" id="esn" value="${esc(v.name)}">
    <label>الكود</label><input type="text" id="esc" dir="ltr" value="${esc(v.code)}" autocapitalize="none" autocomplete="off" style="letter-spacing:2px">
    <div class="muted" style="font-size:.85rem">حروف إنجليزي وأرقام (3 لـ 20)، والكبير والصغير بيفرقوا.</div>
    ${groups.length ? `<label>المجموعة</label><select id="esg">${grpOptions(groups, v.group)}</select>` : ''}`,
    read: o => ({ name: o.querySelector('#esn').value.trim().replace(/\s+/g, ' '), code: o.querySelector('#esc').value.trim(), group: o.querySelector('#esg') ? o.querySelector('#esg').value : (s.group || '') }) });
  if (!r) return false;
  const bad = m => modal({ title: 'تعذر الحفظ', text: m, ok: 'حاضر', cancel: '' }).then(() => editStudent(s, groups, all, pend, r));
  if (r.name.length < 2) return bad('اكتب اسم الطالب');
  if (!/^[A-Za-z0-9]{3,20}$/.test(r.code)) return bad('الكود لازم 3 لـ 20 حرف إنجليزي أو أرقام بس');
  try {
    if (r.code !== s.code) {
      if ([...all, ...pend].some(x => x.code === r.code) || (await S.store.getStudent(r.code))) return bad('الكود ده مستخدم عند طالب تاني');
      if ((await S.store.listResultsByStudent(s.code)).length) return bad('الطالب ده سلّم امتحانات قبل كده وتغيير كوده هيفصل نتايجه عنه. لو لازم تغيّره امسح نتايجه من صفحة نتائج الامتحان الأول.');
    }
    await S.store.renameStudent(s.code, { ...s, name: r.name, code: r.code, group: r.group });
    return true;
  } catch (er) { return bad(er.message); }
}

/* ----- صفحة الطالب عند الدكتور: ملخص الأداء ----- */
async function teacherStudent(code) {
  teacherShell('students', loadingInner);
  const st = await S.store.getStudent(code);
  if (!st) throw new Error('الطالب مش موجود');
  const rs = (await S.store.listResultsByStudent(code)).sort((a, b) => b.submittedAt - a.submittedAt);
  const info = {};
  await Promise.all([...new Set(rs.map(r => r.examId))].map(async id => {
    const m = await S.store.getExam(id); if (!m) return;
    const [c, k] = await Promise.all([loadExamContent(m, false), S.store.getKey(id)]);
    info[id] = { m, qs: c.questions, k };
  }));
  const rows = rs.filter(r => info[r.examId] && info[r.examId].k).map(r => {
    const x = info[r.examId], sc = scoreOf(x.qs, r.answers, x.k.answers, r.grades);
    return { r, subject: subjOf(x.m), title: x.m.title, total: sc.total, score: sc.score, pending: sc.pending, topics: byTopic(x.qs, r.answers, x.k.answers) };
  });
  const pct = x => x.total ? Math.round(x.score / x.total * 100) : 0;
  const avg = rows.length ? Math.round(rows.reduce((s, x) => s + pct(x), 0) / rows.length) : 0;
  const tp = topicsBySubject(rows);

/* ----- محرر الامتحان ----- */
const newQ = () => ({ text: '', image: '', options: ['', '', '', ''], correct: 0, topic: '', pts: 1 });

/*PARSE_START*/
const AR_IDX = { 'أ': 0, 'ا': 0, 'إ': 0, 'آ': 0, 'ب': 1, 'ج': 2, 'د': 3, 'ه': 4, 'هـ': 4 };
const LET = 'هـ|[أاإآبجدهa-eA-E]';
function letterIdx(c) {
  c = String(c).trim();
  if (c in AR_IDX) return AR_IDX[c];
  const l = c.toLowerCase();
  return /^[a-e]$/.test(l) ? l.charCodeAt(0) - 97 : -1;
}
/* مفتاح الإجابات: "1-أ 2-ب 3-ج" أو "أ ب ج د أ" بالترتيب. بيرجع {byNum, seq} */
function parseKey(raw) {
  const t = toAscii(raw).replace(BIDI, '');
  const byNum = {}, seq = [];
  const re = new RegExp('(\\d{1,3})\\s*[-–:)\\.=،]*\\s*\\(?\\s*(' + LET + ')\\s*\\)?(?![\\u0621-\\u064Aa-zA-Z])', 'g');
  let n = 0;
  for (const m of t.matchAll(re)) { byNum[+m[1]] = letterIdx(m[2]); n++; }
  if (n >= 2) return { byNum, seq };
  for (const tk of t.split(/[\s,،;\-–|\/:()]+/).filter(Boolean)) {
    if (/^(?:هـ|[أاإآبجدهa-eA-E])$/.test(tk)) seq.push(letterIdx(tk));
    else if (/^[a-eA-E]{2,}$/.test(tk)) [...tk].forEach(ch => seq.push(letterIdx(ch)));
  }
  return { byNum: {}, seq };
}
/* بيقسم نص سؤال واحد لنص واختيارات (أ ب ج د) حتى لو الاختيارات في نفس السطر */
function splitOptions(s) {
  const re = new RegExp('(?:^|\\s)[\\(\\[]?\\s*(' + LET + ')\\s*[\\)\\]\\.\\-–:]', 'g');
  const ms = [...s.matchAll(re)].map(m => ({ idx: letterIdx(m[1]), start: m.index, end: m.index + m[0].length }));
  let best = null;
  ms.forEach((m, k) => {
    if (m.idx !== 0) return;
    const chain = [m];
    for (let j = k + 1; j < ms.length; j++) if (ms[j].idx === chain.length) chain.push(ms[j]);
    if (!best || chain.length > best.length) best = chain;
  });
  if (!best || best.length < 2) return null;
  return { stem: s.slice(0, best[0].start).trim(), opts: best.map((m, i) => s.slice(m.end, i + 1 < best.length ? best[i + 1].start : s.length).trim()) };
}
function parseQuestions(raw) {
  const lines = toAscii(raw).replace(BIDI, '').replace(/\r/g, '').split('\n').map(s => s.trim()).filter(Boolean);
  const reAns = new RegExp('^(?:الإجابة|الاجابة|الإجابه|الاجابه|الحل|answer|ans)\\s*(?:الصحيحة|الصحيحه)?\\s*[:：\\-–]?\\s*\\(?\\s*(' + LET + ')\\s*\\)?\\s*$', 'i');
  const reQ = /^(?:(?:السؤال|سؤال|س|Q|q)\s*)?(\d{1,3})\s*[\)\.\-–:ـ،]\s*(.*)$/;
  const reQb = /^(?:السؤال|سؤال|س)\s*(\d{1,3})\s+(.+)$/;
  const reQ2 = /^(?:السؤال|سؤال|س)\s*[:\-–]\s*(.+)$/;
  const reKeyHead = /^(?:مفتاح\s+)?(?:الإجابات|الاجابات|نموذج الإجابة|نموذج الاجابة|answers?|key)\s*[:：]?\s*$/i;
  const blocks = [], keyLines = [];
  let cur = null, inKey = false;
  for (const ln of lines) {
    if (blocks.length && reKeyHead.test(ln)) { inKey = true; continue; }
    if (inKey) { keyLines.push(ln); continue; }
    if (blocks.length) {
      const k = parseKey(ln);
      if (Object.keys(k.byNum).length >= 2 && ln.replace(/(\d{1,3})\s*[-–:)\.=،]*\s*\(?\s*(?:هـ|[أاإآبجدهa-eA-E])\s*\)?/g, '').replace(/[\s,،;]/g, '') === '') { keyLines.push(ln); inKey = true; continue; }
    }
    let m;
    if (cur && (m = ln.match(reAns))) { cur.ans = letterIdx(m[1]); continue; }
    if ((m = ln.match(reQ)) || (m = ln.match(reQb))) { cur = { num: +m[1], parts: [m[2]], ans: -1 }; blocks.push(cur); continue; }
    if ((m = ln.match(reQ2))) { cur = { num: blocks.length + 1, parts: [m[1]], ans: -1 }; blocks.push(cur); continue; }
    if (cur) cur.parts.push(ln);
  }
  const key = parseKey(keyLines.join('\n'));
  const valid = []; let skipped = 0;
  blocks.forEach(b => {
    const sp = splitOptions(b.parts.join(' ').replace(/\s+/g, ' ').trim());
    if (!sp) { skipped++; return; }
    let correct = b.ans;
    const options = sp.opts.map((o, i) => { let t = o; if (/[✓✔√]\s*$/.test(t) || /^\*/.test(t)) { correct = i; t = t.replace(/[✓✔√]\s*$/, '').replace(/^\*\s*/, '').trim(); } return t; });
    if (correct < 0) correct = key.byNum[b.num] !== undefined ? key.byNum[b.num] : (key.seq[valid.length] ?? -1);
    if (correct >= options.length) correct = -1;
    valid.push({ num: b.num, text: sp.stem, options, correct });
  });
  return { valid, skipped };
}
/*PARSE_END*/

/* ----- قراءة الـ PDF: صفحات، نصوص بمواضعها، صور، وكروت الأسئلة ----- */
let pdfjsP = null;
function loadPdfJs() {
  if (pdfjsP) return pdfjsP;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  pdfjsP = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = base + 'pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror = () => { pdfjsP = null; rej(new Error('تعذر تحميل قارئ PDF، اتأكد من النت')); };
    document.head.appendChild(s);
  });
  return pdfjsP;
}
async function openPdf(file) { const lib = await loadPdfJs(); return lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; }
async function renderPage(page, scale) {
  const vp = page.getViewport({ scale }), c = document.createElement('canvas');
  c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return c;
}
const TASHKEEL = /^[ً-ٰٟـ]+$/;
const nz = s => String(s).normalize('NFKC');
const mulM = (a, b) => [a[0] * b[0] + a[2] * b[1], a[1] * b[0] + a[3] * b[1], a[0] * b[2] + a[2] * b[3], a[1] * b[2] + a[3] * b[3], a[0] * b[4] + a[2] * b[5] + a[4], a[1] * b[4] + a[3] * b[5] + a[5]];
/* الإحداثيات كلها بوحدة النقطة وأصلها أعلى يمين/يسار الصفحة (y لتحت) */
async function pageGeom(page) {
  const lib = window.pdfjsLib, vp = page.getViewport({ scale: 1 });
  const tc = await page.getTextContent(), items = [];
  tc.items.forEach(it => {
    if (it.str === undefined || it.str === '') return;
    const [x, y] = vp.convertToViewportPoint(it.transform[4], it.transform[5]);
    items.push({ s: it.str, x, y, w: Math.abs(it.width), h: Math.abs(it.height) || 10 });
  });
  const ol = await page.getOperatorList(), OPS = lib.OPS, imgs = [], stack = [];
  let m = [1, 0, 0, 1, 0, 0];
  ol.fnArray.forEach((fn, i) => {
    const a = ol.argsArray[i];
    if (fn === OPS.save) stack.push(m.slice());
    else if (fn === OPS.restore) m = stack.pop() || m;
    else if (fn === OPS.transform) m = mulM(m, a);
    else if (fn === OPS.paintFormXObjectBegin) { stack.push(m.slice()); if (a && a[0]) m = mulM(m, a[0]); }
    else if (fn === OPS.paintFormXObjectEnd) m = stack.pop() || m;
    else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject || fn === OPS.paintImageMaskXObject) {
      const pts = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([u, v]) => vp.convertToViewportPoint(m[0] * u + m[2] * v + m[4], m[1] * u + m[3] * v + m[5]));

function rowsOf(items, tol = 3) {

    const r = rs.find(r => Math.abs(r.y - it.y) <= tol);
    if (r) r.items.push(it); else rs.push({ y: it.y, items: [it] });
  });

}

/* بيدور على عمودين (فراغ رأسي في نص الصفحة) */
function findSplit(g) {

  const xs = cov.map((n, i) => n === min ? lo + i : -1).filter(x => x >= 0);

function hLines(ctx, H, x0, x1) {

  ov.innerHTML = `<div class="row"><b class="grow">اسحب على السؤال (بالماوس أو بصباعك) عشان تقصه</b><button class="btn sm ghost" data-a="prev">‹ السابقة</button><span id="cpn"></span><button class="btn sm ghost" data-a="next">التالية ›</button><button class="btn sm" data-a="close">تم</button></div><div id="cnote" class="muted" style="margin:4px 0"></div><div id="cbx"></div>`;
  document.body.appendChild(ov);

  const show = async () => {
    ov.querySelector('#cpn').textContent = pn + ' / ' + pdf.numPages;
    const box = ov.querySelector('#cbx'); box.innerHTML = '';
    cv = await renderPage(await pdf.getPage(pn), 3);

    if (d.a === 'defn') { imp.defN = +t.value; render(); return; }
    if (d.a === 'btopic') { if (t.value) imp.cards.forEach(c => { c.topic = t.value; }); render(); return; }
    const cd = t.closest('[data-c]'); if (!cd) return;
    const c = imp.cards.find(x => x.id === cd.dataset.c); if (!c) return;
    if (d.f === 'mode') { c.mode = t.value; render(); }
    else if (d.f === 'ignore') { c.ignore = t.checked; render(); }
    else if (d.f === 'correct') c.cp[+d.j || 0] = +t.value;
    else if (d.f === 'pn') { c.partN[+d.j] = +t.value; if (c.cp[+d.j] >= +t.value) c.cp[+d.j] = -1; render(); }
    else if (d.f === 'nparts') { const k = +t.value, last = c.partN[c.partN.length - 1] || c.nOpt || 0; c.partN = Array.from({ length: k }, (_, j) => c.partN[j] ?? last); c.cp = Array.from({ length: k }, (_, j) => c.cp[j] ?? -1); render(); }
    else if (d.f === 'topic') c.topic = t.value;
  };
  host.onclick = e => {
    const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'SELECT') return;
    const a = b.dataset.a;
    if (a === 'x') { host.innerHTML = ''; return; }
    if (a === 'm') {
      imp.method = S.impMethod = b.dataset.m;
      if (imp.method === 'img' || imp.method === 'pdf') imp.cards.forEach(c => { c.mode = modeOf(c); });
      render(); return;
    }
    if (a === 'manual') {
      manualCrop(imp.pdf, r => { imp.cards.push({ id: uid(), page: r.page, num: '', img: r.img, fig: '', text: '', options: [], nOpt: 0, partN: [0], cp: [-1], essay: false, flag: '', mode: 'img', ignore: false, topic: '' }); render(); });
      return;
    }
    if (a === 'key') {
      const k = parseKey($('#keyTx').value), use = imp.cards.filter(c => !c.ignore && !isEss(c)); let n = 0;
      if (Object.keys(k.byNum).length) use.forEach(c => { if (c.num !== '' && k.byNum[c.num] !== undefined) { c.cp[0] = k.byNum[c.num]; n++; } });
      else { const slots = use.flatMap(c => (c.mode === 'img' ? c.partN : [0]).map((_, j) => [c, j])); k.seq.forEach((v, i) => { if (slots[i]) { slots[i][0].cp[slots[i][1]] = v; n++; } }); }
      render(); sayX(n ? `اتطبقت ${n} إجابة.` : 'مقدرتش أفهم المفتاح. اكتبه بشكل 1-أ 2-ب 3-ج.', n ? 'ok' : 'bad'); return;
    }
    if (a === 'add') {
      const use = imp.cards.filter(c => !c.ignore);
      if (!use.length) return sayX('مفيش أسئلة مختارة للإضافة.', 'bad');
      clearBlank();
      use.forEach(c => {
        if (c.mode === 'essimg') ex.questions.push({ type: 'essay', text: '', image: c.img, options: [], correct: -1, topic: c.topic || '', pts: 5 });
        else if (c.mode === 'esstext') ex.questions.push({ type: 'essay', text: c.text, image: c.fig || '', options: [], correct: -1, topic: c.topic || '', pts: 5 });
        else if (c.mode === 'text' && c.options.length >= 2 && c.partN.length <= 1) ex.questions.push({ text: c.text, image: c.fig || '', options: c.options.slice(), correct: c.cp[0], topic: c.topic || '', pts: 1 });
        else c.partN.forEach((_, j) => ex.questions.push({ text: '', image: j ? '' : c.img, options: LETTERS.slice(0, pnOf(c, j)), letters: true, correct: c.cp[j] ?? -1, topic: c.topic || '', pts: 1, ...(j ? { cont: true } : {}) }));
      });
      const noAns = use.filter(c => !isEss(c) && (c.mode === 'img' ? c.cp : [c.cp[0]]).some(x => x < 0)).length;
      addNote(`تمت إضافة ${use.length} سؤال.` + (noAns ? ` ${noAns} منهم من غير إجابة صحيحة، حددها قبل الحفظ.` : '') + ' راجع الأسئلة قبل الحفظ.', noAns ? 'warn' : 'ok');
      return;
    }
    if (a === 'parse') {
      const { valid, skipped } = parseQuestions($('#impTx').value), k = parseKey($('#keyTx2').value);
      if (!valid.length) return sayX('ما لقيتش أسئلة بالشكل المطلوب. اتأكد إن كل سؤال له رقم وإن الاختيارات بتبدأ بـ أ) ب) ج) د).', 'bad');
      valid.forEach((q, i) => { if (q.correct < 0) { const v = Object.keys(k.byNum).length ? k.byNum[q.num] : k.seq[i]; if (v !== undefined && v < q.options.length) q.correct = v; } });
      clearBlank();
      valid.forEach(q => ex.questions.push({ text: q.text, image: '', options: q.options, correct: q.correct, topic: '', pts: 1 }));
      const noAns = valid.filter(q => q.correct < 0).length;
      addNote(`تمت إضافة ${valid.length} سؤال.` + (noAns ? ` ${noAns} منهم من غير إجابة صحيحة محددة، حددها بنفسك.` : '') + (skipped ? ` ${skipped} اتتخطوا لأن اختياراتهم مش واضحة.` : '') + ' راجع كل الأسئلة قبل الحفظ.', noAns || skipped ? 'warn' : 'ok');
      return;
    }
    if (a === 'bub') { ex.type = 'bubble'; redraw(); }
  };
  render();
}

async function editor(id) {
  teacherShell('exams', loadingInner);
  let ex;
  S.cfg = await S.store.getSettings();
  if (id) {
    const [m, key] = await Promise.all([S.store.getExam(id), S.store.getKey(id)]);
    if (!m || !key) throw new Error('مش لاقي الامتحان');
    const nc = await loadExamContent(m, true);
    ex = { ...JSON.parse(JSON.stringify(m)), subject: subjOf(m), type: m.type === 'bubble' ? 'bubble' : 'mcq', groups: m.groups || [], questions: [], pages: [], n: 30, choices: 4, bAns: [], bTopics: [], oldPacks: m.packs || 0, bPts: [], bEssays: [], bCont: [], showPts: m.showPts !== false, opensAt: m.opensAt || 0, closesAt: m.closesAt || 0, release: m.release === 'instant' ? 'instant' : 'manual' };
    if (ex.type === 'bubble') { const mq = nc.questions.filter(q => !isEssay(q)); ex.pages = nc.pages; ex.n = mq.length; ex.choices = mq[0] ? mq[0].options.length : 4; ex.bAns = key.answers.slice(0, mq.length); ex.bTopics = mq.map(q => q.topic || ''); ex.bPts = mq.map(q => qPts(q)); ex.bCont = mq.map(q => !!q.cont); ex.bEssays = nc.questions.filter(isEssay).map(q => qPts(q)); }
    else { ex.questions = nc.questions; ex.questions.forEach((q, i) => { q.correct = key.answers[i] ?? 0; q.topic = q.topic || ''; q.pts = qPts(q); }); }
    if (!ex.questions.length) ex.questions = [newQ()];
  } else ex = { id: uid(), title: '', subject: S.subjDash || 'bio', type: 'mcq', durationMin: 30, shuffle: true, active: true, createdAt: Date.now(), groups: [], questions: [newQ()], pages: [], n: 30, choices: 4, bAns: [], bTopics: [], bPts: [], bEssays: [], bCont: [], oldPacks: 0, release: 'manual', showAnswers: true, showPts: true, opensAt: 0, closesAt: 0 };
  drawEditor(ex, !!id);
}

const topicList = (cur, subj) => { const t = topicsOf(S.cfg, subj); return cur && !t.includes(cur) ? [...t, cur] : t; };
const topicSelect = (cur, subj, attrs) => { const l = topicList(cur, subj); return l.length ? `<select ${attrs}><option value="">بدون باب</option>${l.map(t => `<option value="${esc(t)}" ${t === cur ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>` : ''; };
function qEditor(q, i, subj, num, multi) {
  const pt = `<label class="muted" style="font-weight:400;margin:0">الدرجة <input type="number" min="0.25" step="0.25" data-q="${i}" data-f="pts" value="${fmtN(qPts(q))}" style="width:76px;display:inline-block"></label>`;
  const head = `<div class="row"><b class="grow">سؤال ${num.n}${multi ? ' · جزء ' + num.p : ''}${q.letters && !q.cont ? ' <span class="badge">صورة + أ ب ج د</span>' : ''}${isEssay(q) ? ' <span class="badge">مقالي</span>' : ''}</b>${pt}<button class="btn sm danger" data-act="delq" data-q="${i}">${q.cont ? 'حذف الجزء' : 'حذف السؤال'}</button></div>`;
  const topic = topicList(q.topic, subj).length ? `<label style="margin:8px 0 2px">الباب</label>${topicSelect(q.topic, subj, `data-q="${i}" data-f="topic"`)}` : '';
  if (isEssay(q)) {
    return `<div class="card">${head}
    <textarea rows="3" data-q="${i}" data-f="text" placeholder="نص السؤال المقالي">${esc(q.text)}</textarea>
    ${q.image ? `<img src="${esc(q.image)}" alt="" style="max-width:240px;display:block;margin:8px 0;border-radius:12px"><button class="btn sm danger" data-act="rmimg" data-q="${i}">شيل الصورة</button>`
      : `<label style="font-weight:400" class="muted">صورة (اختياري): <input type="file" accept="image/*" data-q="${i}" data-f="img"></label>`}
    <div class="muted" style="margin-top:6px">الطالب بيكتب الإجابة أو يرفع صورة ورقته، وانت بتصححها وتحط الدرجة من صفحة النتائج.</div>${topic}</div>`;
  }
  if (q.letters && q.cont) {
    return `<div class="card" style="margin-inline-start:16px;border-inline-start:3px solid var(--accent)">${head}
    <label style="margin:8px 0 2px">عدد الاختيارات</label><select data-q="${i}" data-f="nopt" style="width:auto">${[2, 3, 4, 5].map(n => `<option ${n === q.options.length ? 'selected' : ''}>${n}</option>`).join('')}</select>
    ${q.correct < 0 ? '<div class="msg bad" style="padding:4px 10px;margin:8px 0 4px">حدد الإجابة الصحيحة للجزء ده</div>' : '<div class="muted" style="margin-top:8px">الإجابة الصحيحة</div>'}
    <div class="pills">${q.options.map((l, k) => `<label class="pill sm"><input type="radio" name="c${i}" data-q="${i}" data-f="correct" value="${k}" ${q.correct === k ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div>${topic}</div>`;
  }
  if (q.letters) {
    return `<div class="card">${head}
    ${q.image ? `<img class="thumb" src="${esc(q.image)}" alt="">` : '<div class="msg bad">مفيش صورة للسؤال ده</div>'}
    <textarea rows="1" data-q="${i}" data-f="text" placeholder="نص إضافي (اختياري)">${esc(q.text)}</textarea>
    <label style="margin:8px 0 2px">عدد الاختيارات</label><select data-q="${i}" data-f="nopt" style="width:auto">${[2, 3, 4, 5].map(n => `<option ${n === q.options.length ? 'selected' : ''}>${n}</option>`).join('')}</select>
    ${q.correct < 0 ? '<div class="msg bad" style="padding:4px 10px;margin:8px 0 4px">حدد الإجابة الصحيحة</div>' : '<div class="muted" style="margin-top:8px">الإجابة الصحيحة</div>'}
    <div class="pills">${q.options.map((l, k) => `<label class="pill sm"><input type="radio" name="c${i}" data-q="${i}" data-f="correct" value="${k}" ${q.correct === k ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div>${topic}
    <button class="btn sm ghost" data-act="addpart" data-q="${i}" style="margin-top:8px">+ جزء تاني للسؤال (له اختياراته وإجابته)</button></div>`;
  }
  return `<div class="card">${head}
  <textarea rows="2" data-q="${i}" data-f="text" placeholder="نص السؤال">${esc(q.text)}</textarea>
  ${q.image ? `<img src="${esc(q.image)}" alt="" style="max-width:240px;display:block;margin:8px 0;border-radius:12px"><button class="btn sm danger" data-act="rmimg" data-q="${i}">شيل الصورة</button>`
    : `<label style="font-weight:400" class="muted">صورة (اختياري): <input type="file" accept="image/*" data-q="${i}" data-f="img"></label>`}
  ${topic}
  ${q.correct < 0 ? '<div class="msg bad" style="padding:4px 10px;margin:8px 0 4px">حدد الإجابة الصحيحة بالدايرة</div>' : '<div class="muted" style="margin-top:8px">حدد الإجابة الصحيحة بالدايرة</div>'}
  ${q.options.map((o, k) => `<div class="row" style="margin:6px 0"><input type="radio" name="c${i}" data-q="${i}" data-f="correct" value="${k}" ${q.correct === k ? 'checked' : ''}>
    <input class="grow" type="text" data-q="${i}" data-o="${k}" value="${esc(o)}" placeholder="اختيار ${k + 1}">
    ${q.options.length > 2 ? `<button class="btn sm danger" data-act="delo" data-q="${i}" data-o="${k}">×</button>` : ''}</div>`).join('')}
  <button class="btn sm ghost" data-act="addo" data-q="${i}">+ اختيار</button></div>`;
}

  <label class="row" style="font-weight:400"><input type="checkbox" data-k="showAnswers" ${ex.showAnswers !== false ? 'checked' : ''}> أظهر للطالب إجاباته والإجابات الصحيحة مع النتيجة</label>

  ${bubble ? bubbleEditor(ex) : `<div class="row"><button class="btn ghost" data-act="import">📥 استيراد أسئلة (PDF أو نص)</button>

  <div class="card"><div class="row"><span class="muted">درجة كل أسئلة الاختيار:</span><input type="number" id="bulkP" min="0.25" step="0.25" value="1" style="width:80px"><button class="btn sm ghost" data-act="bulkp">طبّق على كل الأسئلة</button><span class="muted" style="font-size:.85rem">وتقدر تغيّر درجة أي سؤال لوحده</span></div></div>
  ${(() => { const nums = qNums(ex.questions); return ex.questions.map((q, i) => qEditor(q, i, ex.subject, nums[i], nums[i].multi)).join(''); })()}
  <div class="row"><button class="btn ghost" data-act="addq">+ سؤال اختيارات</button><button class="btn ghost" data-act="adde">+ سؤال مقالي</button></div>`}
  <div class="row" style="margin-top:12px"><span class="grow"></span><button class="btn" data-act="save">حفظ الامتحان</button></div><div id="msg"></div></div>`);
  window.scrollTo(0, y);
  if (!isEdit && (ex.title || ex.pages.length || ex.questions.some(q => q.text || q.image))) setGuard();
  const root = $('#ed'), redraw = () => drawEditor(ex, isEdit);
  root.oninput = e => {
    const t = e.target, d = t.dataset; if (!S.guard) setGuard();
    if (t.closest('#impHost')) return;
    if (d.k) { if (t.type !== 'checkbox' && t.tagName !== 'SELECT' && d.k !== 'n') ex[d.k] = t.type === 'number' ? Number(t.value) : t.value; }
    else if (d.bp !== undefined) ex.bPts[+d.bp] = +t.value > 0 ? +t.value : 1;
    else if (d.be !== undefined) ex.bEssays[+d.be] = +t.value > 0 ? +t.value : 1;
    else if (d.q !== undefined) { const q = ex.questions[+d.q]; if (d.o !== undefined) q.options[+d.o] = t.value; else if (d.f === 'text') q.text = t.value; else if (d.f === 'pts') q.pts = +t.value > 0 ? +t.value : 1; }
  };
  root.onchange = async e => {
    const t = e.target, d = t.dataset; if (!S.guard) setGuard();
    if (t.closest('#impHost')) return;
    if (d.k === 'subject') { ex.subject = t.value; redraw(); }
    else if (d.k === 'type') { ex.type = t.value; redraw(); }
    else if (d.k === 'n') { const n = Math.max(1, Math.min(200, Math.round(+t.value) || 1)); ex.n = n; ex.bAns.length = n; ex.bTopics.length = n; ex.bCont.length = n; for (let i = 0; i < n; i++) ex.bCont[i] = !!ex.bCont[i]; for (let i = 0; i < n; i++) { if (ex.bAns[i] === undefined) ex.bAns[i] = -1; if (ex.bTopics[i] === undefined) ex.bTopics[i] = ''; } redraw(); }
    else if (d.k === 'choices') { ex.choices = +t.value; ex.bAns = ex.bAns.map(a => a >= ex.choices ? -1 : a); redraw(); }
    else if (d.dt) { ex[d.dt] = t.value ? new Date(t.value).getTime() : 0; }
    else if (d.bc !== undefined) { ex.bCont[+d.bc] = t.checked; redraw(); }
    else if (d.k === 'release') { ex.release = t.value; redraw(); }
    else if (d.k && t.type === 'checkbox') ex[d.k] = t.checked;
    else if (d.gk !== undefined) { ex.groups = ex.groups.filter(g => g !== d.gk); if (t.checked) ex.groups.push(d.gk); }
    else if (d.ba !== undefined) { ex.bAns[+d.ba] = +t.value; t.closest('.brow').classList.add('done'); }
    else if (d.bt !== undefined) ex.bTopics[+d.bt] = t.value;
    else if (t.id === 'bpdf' && t.files[0]) {
      const st = $('#bst'), say = s => { st.textContent = s; };
      try {
        say('جاري قراءة الملف...');
        const pdf = await openPdf(t.files[0]);
        if (pdf.numPages > 40) throw new Error('الملف أكتر من 40 صفحة.');
        const pages = await pdfPagesToImages(pdf, say);
        if (pages.reduce((s, p) => s + p.length, 0) > 9e6) throw new Error('حجم صفحات الملف كبير. قلل عدد الصفحات أو قسّم الامتحان.');
        ex.pages = pages; redraw();
      } catch (er) { st.textContent = ''; setMsg(er.message || 'تعذر قراءة الملف'); }
    }
    else if (d.f === 'topic') ex.questions[+d.q].topic = t.value;
    else if (d.f === 'correct') ex.questions[+d.q].correct = +t.value;
    else if (d.f === 'nopt') { const q = ex.questions[+d.q]; q.options = LETTERS.slice(0, +t.value); if (q.correct >= q.options.length) q.correct = -1; redraw(); }
    else if (d.f === 'img' && t.files[0]) { try { ex.questions[+d.q].image = await compress(t.files[0]); redraw(); } catch (er) { setMsg(er.message); } }
  };
  root.onclick = async e => {
    const th = e.target.closest('img.thumb'); if (th) return zoomImg(th.src);
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (!S.guard && b.dataset.act !== 'save') setGuard();
    const d = b.dataset, a = d.act, q = ex.questions[+d.q];
    if (a === 'adde') { ex.questions.push(newEssay()); redraw(); window.scrollTo(0, document.body.scrollHeight); }
    else if (a === 'bulkp') { const v = +$('#bulkP').value; if (!(v > 0)) return setMsg('اكتب درجة صحيحة'); ex.questions.forEach(x => { if (!isEssay(x)) x.pts = v; }); redraw(); }
    else if (a === 'bbulk') { const v = +$('#bbulk').value; if (!(v > 0)) return setMsg('اكتب درجة صحيحة'); ex.bPts = Array.from({ length: ex.n }, () => v); redraw(); }
    else if (a === 'beadd') { ex.bEssays.push(5); redraw(); }
    else if (a === 'bedel') { ex.bEssays.splice(+d.j, 1); redraw(); }
    else if (a === 'addq') { ex.questions.push(newQ()); redraw(); window.scrollTo(0, document.body.scrollHeight); }
    else if (a === 'delq') { if (ex.questions.length > 1 && confirm(q.cont ? 'حذف الجزء ده؟' : 'حذف السؤال (وكل أجزائه)؟')) { let k = +d.q + 1; if (!q.cont) while (ex.questions[k] && ex.questions[k].cont) k++; ex.questions.splice(+d.q, q.cont ? 1 : k - +d.q); if (ex.questions[0] && ex.questions[0].cont) delete ex.questions[0].cont; redraw(); } }
    else if (a === 'addo') { q.options.push(''); redraw(); }
    else if (a === 'delo') { q.options.splice(+d.o, 1); if (q.correct === +d.o) q.correct = 0; else if (q.correct > +d.o) q.correct--; redraw(); }
    else if (a === 'rmimg') { q.image = ''; redraw(); }
    else if (a === 'bulkt') { const v = $('#bulkT').value; if (!v) return setMsg('اختار الباب الأول'); ex.questions.forEach(x => { x.topic = v; }); redraw(); }
    else if (a === 'ball') { const v = $('#brT').value; if (!v) return setMsg('اختار الباب الأول'); for (let i = 0; i < ex.n; i++) ex.bTopics[i] = v; redraw(); }
    else if (a === 'addpart') { let k = +d.q + 1; while (ex.questions[k] && ex.questions[k].cont) k++; ex.questions.splice(k, 0, { text: '', image: '', options: LETTERS.slice(0, 4), letters: true, correct: -1, topic: q.topic || '', pts: 1, cont: true }); redraw(); }
    else if (a === 'bkey') {
      const k = parseKey($('#bkey').value); let n = 0;
      if (Object.keys(k.byNum).length) Object.entries(k.byNum).forEach(([num, v]) => { if (+num >= 1 && +num <= ex.n && v < ex.choices) { ex.bAns[+num - 1] = v; n++; } });
      else k.seq.forEach((v, i) => { if (i < ex.n && v < ex.choices) { ex.bAns[i] = v; n++; } });
      redraw(); if (n) setMsg(`اتطبقت ${n} إجابة`, 'ok'); else setMsg('مقدرتش أفهم المفتاح. اكتبه بشكل 1-أ 2-ب 3-ج.');
    }
    else if (a === 'brange') {
      const v = $('#brT').value, A = +$('#brA').value, B = +$('#brB').value;
      if (!v || !(A >= 1) || !(B >= A)) return setMsg('اختار الباب ورقم السؤال من وإلى');
      for (let i = A - 1; i < Math.min(B, ex.n); i++) ex.bTopics[i] = v; redraw();
    }
    else if (a === 'import') openImport(ex, redraw);
    else if (a === 'save') await saveEditor(ex, b);
  };
}

async function saveEditor(ex, btn) {
  const err = m => { setMsg(m); };
  if (!ex.title.trim()) return err('اكتب عنوان الامتحان');
  if (!(ex.durationMin >= 1)) return err('المدة لازم تكون دقيقة على الأقل');
  const bubble = ex.type === 'bubble';
  if (ex.opensAt && ex.closesAt && ex.closesAt <= ex.opensAt) return err('وقت القفل لازم يكون بعد وقت الفتح');
  let content, key, imgs, count;
  if (bubble) {
    if (!ex.pages.length) return err('ارفع ملف الـ PDF بتاع الأسئلة الأول');
    const n = Math.round(ex.n);
    if (!(n >= 1 && n <= 200)) return err('عدد الأسئلة من 1 لـ 200');
    for (let i = 0; i < n; i++) if (!(ex.bAns[i] >= 0 && ex.bAns[i] < ex.choices)) return err(`حدد الإجابة الصحيحة لسؤال ${i + 1}`);
    imgs = ex.pages.slice();
    content = { mode: 'bubble', pages: [], n, choices: ex.choices, topics: Array.from({ length: n }, (_, i) => ex.bTopics[i] || ''), pts: Array.from({ length: n }, (_, i) => ex.bPts[i] > 0 ? ex.bPts[i] : 1), essays: ex.bEssays.map(p => p > 0 ? p : 1), cont: Array.from({ length: n }, (_, i) => !!ex.bCont[i] && i > 0) };
    count = n + ex.bEssays.length;
    key = { answers: ex.bAns.slice(0, n) };
  } else {
    if (!ex.questions.length) return err('أضف سؤال واحد على الأقل');
    for (const [i, q] of ex.questions.entries()) {
      if (isEssay(q)) { if (!q.text.trim() && !q.image) return err(`سؤال ${i + 1}: اكتب نص السؤال المقالي`); continue; }
      if (q.letters) { if (!q.image && !q.cont) return err(`سؤال ${i + 1}: مفيش صورة`); }
      else {
        if (!q.text.trim()) return err(`سؤال ${i + 1}: اكتب نص السؤال`);
        if (q.options.some(o => !o.trim())) return err(`سؤال ${i + 1}: فيه اختيار فاضي (املاه أو احذفه)`);
      }
      if (!(q.correct >= 0 && q.correct < q.options.length)) return err(`سؤال ${i + 1}: حدد الإجابة الصحيحة`);
    }
    imgs = ex.questions.map(q => q.image || ''); count = ex.questions.length;
    content = { questions: ex.questions.map(q => ({ text: q.text.trim(), image: '', options: q.options.map(o => o.trim()), topic: q.topic || '', pts: qPts(q), ...(q.letters ? { letters: true } : {}), ...(q.cont ? { cont: true } : {}), ...(isEssay(q) ? { type: 'essay' } : {}) })) };
    key = { answers: ex.questions.map(q => isEssay(q) ? -1 : q.correct) };
  }
  if (imgs.some(s => s && s.length > 900000)) return err('فيه صورة حجمها كبير جدًا. صغّرها.');
  const { refs, packs } = buildPacks(imgs);
  if (packs.reduce((s, p) => s + p.reduce((a, b) => a + b.length, 0), 0) > 12e6) return err('حجم الصور كبير (أكتر من 9 ميجا تقريبًا). قلل عدد الأسئلة أو الصفحات.');
  if (bubble) content.pages = refs; else content.questions.forEach((q, i) => { q.image = refs[i]; });
  if (new Blob([JSON.stringify(content)]).size > 900000) return err('حجم الامتحان كبير. قلل الصور أو الأسئلة.');
  const exam = { id: ex.id, title: ex.title.trim(), subject: ex.subject || 'bio', type: bubble ? 'bubble' : 'mcq', durationMin: Math.round(ex.durationMin), shuffle: bubble ? false : !!ex.shuffle, active: !!ex.active, closedAt: ex.active ? 0 : (ex.closedAt || 0),
    createdAt: ex.createdAt, published: !!ex.published, opensAt: ex.opensAt || 0, closesAt: ex.closesAt || 0, showPts: ex.showPts !== false, release: ex.release === 'instant' ? 'instant' : 'manual', hasEssay: bubble ? ex.bEssays.length > 0 : ex.questions.some(isEssay), showAnswers: ex.showAnswers !== false, groups: ex.groups || [], qCount: count, packs: packs.length };
  btn.disabled = true; setMsg('جاري الحفظ...', 'ok');
  try { await S.store.saveExam(exam, content, key, packs, ex.oldPacks || 0); S.guard = null; go('#teacher'); }
  catch (e) { btn.disabled = false; setMsg(e.message); }
}

  const counts = () => !!ex.published || (ex.release === 'instant' && !hasEs);

  const base = hasEs ? rows.filter(r => !r.pending) : rows, nPend = rows.filter(r => r.pending).length;
  const avg = base.length ? Math.round(base.reduce((s, r) => s + pct(r.score), 0) / base.length) : 0;
  const classTopics = mergeTopics(rows.map(r => byTopic(ex.questions, r.answers, key.answers)));
  const qLabel = (q, i) => `${i + 1}. ${q.text ? esc(q.text.slice(0, 70)) : '<span class="muted">(سؤال بصورة)</span>'}`;

  ${hasEs && nPend ? `<div class="msg warn">${nPend} طالب لسه مقاليهم متصححش. اضغط "تصحيح" جنب اسم كل طالب.</div>` : ''}

      (ing.length ? ing.map(a => {
        const over = a.startedAt && (Date.now() - a.startedAt) / 60000 > ex.durationMin + 2;
        return `<div class="row" style="margin-top:6px"><span class="grow">${esc(a.name)} <span class="code" style="font-size:.8rem">${esc(a.studentCode || '')}</span></span>${a.away && !over ? '<span class="badge warn">🔴 خارج الصفحة الآن</span>' : ''}${a.leaves ? `<span class="badge warn">⚠ خرج ${a.leaves} مرة${a.awaySec ? ' · ' + fmtSec(a.awaySec) : ''}</span>` : ''}${a.shots ? `<span class="badge bad">📷 تصوير ${a.shots}</span>` : ''}${a.short ? `<span class="badge warn">⚡ ${a.short} خروج قصير</span>` : ''}${over ? '<span class="badge">انتهى وقته ولم يسلّم</span>' : ''}</div>`;
      }).join('') : '<p class="muted" style="margin:6px 0 0">مفيش حد بيمتحن دلوقتي.</p>');
    return true;
  };
  drawLive(atts);
  const refreshLive = async () => { try { drawLive(await S.store.listLive(id)); } catch (e) {} };
  const sigOf = (r2, a2) => r2.length + '|' + a2.map(a => [a.studentCode || '', a.leaves || 0, a.shots || 0, a.short || 0, a.submitted ? 1 : 0, a.away ? 1 : 0].join(':')).sort().join(',');
  const lastSig = sigOf(rs, atts); let busyR = false;
  const refreshAll = async () => {
    if (busyR || !$('#live')) return; busyR = true;
    try {
      const [r2, a2] = await Promise.all([S.store.listResults(id), S.store.listAttempts(id)]);
      if (sigOf(r2, a2) !== lastSig) { const y = window.scrollY; busyR = false; await results(id, true); window.scrollTo(0, y); return; }
      drawLive(a2);
    } catch (e) {} busyR = false;
  };
  const liveIv = setInterval(() => { if (!$('#live')) return clearInterval(liveIv); if (!document.hidden) refreshAll(); }, 30000);
  const onVis = () => { if (!document.hidden) refreshAll(); };
  document.addEventListener('visibilitychange', onVis); window.addEventListener('online', onVis);
  S.cleanup = () => { clearInterval(liveIv); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('online', onVis); };
  $('#live').onclick = e => { if (e.target.closest('[data-live]')) refreshLive(); };
  const syncScores = async (e2, rs2) => { if (!counts()) { await S.store.deleteExamScore(id); await recomputeRanks(subjOf(e2)); return; } await saveScores(e2, rs2); };
  if (ex.release === 'instant' && !hasEs && rows.length) { saveScores(ex, rows, true).catch(() => {}); }
  const csv = $('#csv');
  if (csv) csv.onclick = () => {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [['الاسم', 'الكود', ...(hasEs ? ['درجة الاختيارات', 'درجة المقالي'] : []), 'الدرجة', 'من', 'النسبة', 'وقت التسليم', 'مرات الخروج', 'مدة الخروج (ثانية)', 'محاولات التصوير', 'خروج قصير'].map(q).join(',')]
      .concat(rows.map(r => [r.name, r.studentCode || '', ...(hasEs ? [r.mcq, r.pending ? 'لم يصحح' : r.es] : []), r.score, total, pct(r.score) + '%', fmtDate(r.submittedAt), r.leaves, r.awaySec, r.shots, r.short].map(q).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
    a.download = 'results.csv'; a.click();
  };
  const pub = $('#pub');
  if (pub) pub.onclick = async () => {
    const show = $('#showAns').checked;
    if (!confirm(nPend ? `${nPend} طالب مقاليهم لسه متصححش، هيظهرلهم درجة الاختيارات بس ومكتوب إن المقالي بيتصحح. تنشر؟` : 'نشر النتائج للطلاب دلوقتي؟')) return;
    pub.disabled = true;
    try {
      const now = Date.now();
      const docs = rows.filter(r => r.studentCode).map(r => pubDoc(ex, r, key.answers, scoreOf(ex.questions, r.answers, key.answers, r.grades), show, now));
      await S.store.publishFor(docs);
      await S.store.setFlags(id, { published: true, showAnswers: show });
      ex.published = true; await syncScores(ex, rows);
      results(id);
    } catch (e) { pub.disabled = false; setMsg(e.message); }
  };
  const unpub = $('#unpub');
  if (unpub) unpub.onclick = async () => {
    if (!confirm('إخفاء النتائج عن الطلاب؟')) return;
    try { await S.store.unpublish(id, rows.map(r => r.studentCode).filter(Boolean)); await S.store.setFlags(id, { published: false }); ex.published = false; await syncScores(ex, rows); results(id); } catch (e) { setMsg(e.message); }
  };
  $('#rs').onclick = async e => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    const r = rows.find(x => x.id === b.dataset.id);
    if (!confirm(`مسح نتيجة "${r.name}" والسماح له يمتحن تاني؟`)) return;
    try { await S.store.deleteResult(r); await syncScores(ex, rows.filter(x => x.id !== r.id)); results(id); } catch (er) { setMsg(er.message); }
  };
}


/* ----- الترتيب التراكمي: بيتحسب من جهاز الدكتور بس ----- */
async function saveScores(ex, rows, onlyIfChanged) {
  const scores = {};
  rows.forEach(r => { if (r.studentCode && !r.pending) scores[r.studentCode] = { name: r.name, pts: r.score }; });
  if (onlyIfChanged) { const cur = await S.store.getExamScore(ex.id); if (cur && JSON.stringify(cur.scores) === JSON.stringify(scores)) return; }
  await S.store.saveExamScore({ id: ex.id, subject: subjOf(ex), scores });
  await recomputeRanks(subjOf(ex));
}
async function recomputeRanks(subj) {
  const all = (await S.store.listExamScores()).filter(x => x.subject === subj), tot = {};
  all.forEach(x => Object.entries(x.scores || {}).forEach(([c, v]) => { const t = tot[c] = tot[c] || { code: c, name: v.name, pts: 0, exams: 0 }; t.pts += v.pts; t.exams++; t.name = v.name; }));
  const arr = Object.values(tot).filter(t => t.pts > 0).sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name, 'ar')), list = [];
  arr.forEach((t, i) => list.push({ ...t, pts: Math.round(t.pts * 100) / 100, rank: i && t.pts === arr[i - 1].pts ? list[i - 1].rank : i + 1 }));
  await S.store.saveRank(subj, { list: list.filter(x => x.rank <= 3), updatedAt: Date.now() });
}

/* ----- تصحيح المقالي ----- */
async function gradePage(id, code) {
  teacherShell('exams', loadingInner);
  const aid = id + '_' + code;
  const [meta, r] = await Promise.all([S.store.getExam(id), S.store.getResult(aid)]);
  if (!meta || !r) throw new Error('مش لاقي تسليم الطالب ده');
  const nc = await loadExamContent(meta, true), qs = nc.questions, grades = { ...(r.grades || {}) };
  const ess = qs.map((q, i) => ({ q, i })).filter(o => isEssay(o.q));
  const imgs = {};
  await Promise.all(ess.flatMap(o => ((r.essay && r.essay[o.i] && r.essay[o.i].imgs) || []).map(async k => { imgs[o.i + '_' + k] = await S.store.getEssayImg(aid + '_' + o.i + '_' + k); })));
  teacherShell('exams', `<div id="gr"><a href="#teacher/results/${esc(id)}">→ رجوع للنتائج</a><h2>تصحيح: ${esc(r.name)} <span class="code" style="font-size:.85rem">${esc(code)}</span></h2><p class="muted">${esc(meta.title)}</p>
  ${ess.map(o => { const a = (r.essay && r.essay[o.i]) || { t: '', imgs: [] }, p = qPts(o.q);
    return `<div class="card"><div class="row"><b class="grow">${esc(o.q.text)}</b><span class="badge">من ${fmtN(p)}</span></div>
    ${o.q.image ? `<img class="thumb" src="${esc(o.q.image)}" alt="" style="max-width:240px;border-radius:10px">` : ''}
    <div class="muted" style="margin-top:8px">إجابة الطالب (كتابة):</div>
    ${a.t && a.t.trim() ? `<div class="card" style="white-space:pre-wrap;background:var(--soft)">${esc(a.t)}</div>` : '<div class="muted">— مفيش نص مكتوب —</div>'}
    ${(a.imgs || []).length ? `<div class="muted" style="margin-top:8px">صور الحل المكتوب (اضغط للتكبير):</div><div class="row">${a.imgs.map(k => imgs[o.i + '_' + k] ? `<img class="thumb" src="${imgs[o.i + '_' + k]}" alt="" style="height:150px;border-radius:8px;border:1px solid var(--line)">` : '<span class="muted">صورة مش متاحة</span>').join('')}</div>` : ''}
    <div class="row" style="margin-top:10px"><label style="margin:0">الدرجة <input type="number" min="0" max="${p}" step="0.25" data-g="${o.i}" value="${typeof grades[o.i] === 'number' ? grades[o.i] : ''}" style="width:90px;display:inline-block"> من ${fmtN(p)}</label><button class="btn sm ghost" data-full="${o.i}" data-p="${p}">الدرجة كاملة</button><button class="btn sm ghost" data-zero="${o.i}">صفر</button></div></div>`; }).join('')}
  <div id="msg"></div><button class="btn block" id="gsave">حفظ الدرجات</button></div>`);
  const root = $('#gr');
  root.onclick = async e => {
    const im = e.target.closest('img.thumb'); if (im) return zoomImg(im.src);
    const f = e.target.closest('[data-full]'), z = e.target.closest('[data-zero]');
    if (f) { const el = root.querySelector(`[data-g="${f.dataset.full}"]`); el.value = f.dataset.p; }
    if (z) { root.querySelector(`[data-g="${z.dataset.zero}"]`).value = 0; }
    if (e.target.id === 'gsave') {
      const g = {};
      for (const o of ess) {
        const v = root.querySelector(`[data-g="${o.i}"]`).value;
        if (v === '') return setMsg('حط درجة لكل سؤال مقالي (أو صفر)');
        const n = +v; if (!(n >= 0) || n > qPts(o.q)) return setMsg(`درجة السؤال لازم بين 0 و ${fmtN(qPts(o.q))}`);
        g[o.i] = n;
      }
      e.target.disabled = true;
      try { await S.store.setGrades(aid, g); go('#teacher/results/' + id); } catch (er) { e.target.disabled = false; setMsg(er.message); }
    }
  };
}
