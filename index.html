const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/-/g, '').slice(0, 16);
const pad = n => String(n).padStart(2, '0');

const STU_ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genStuCode = () => { let s = ''; for (let i = 0; i < 6; i++) s += STU_ALPHA[Math.floor(Math.random() * STU_ALPHA.length)]; return s; };
const readDataUrl = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('تعذر قراءة الملف')); r.readAsDataURL(f); });

const mem = {};
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },

};

function hashStr(s) { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return h >>> 0; }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function compress(file, maxW = 720, quality = 0.65) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxW / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => rej(new Error('الصورة غير صالحة'));
    img.src = u;
  });
}

/* ========= التخزين: وضع تجريبي محلي ========= */
const DemoStore = {
  db() { const v = ls.get('examdemo2'); return v ? JSON.parse(v) : { exams: {}, keys: {}, students: {}, attempts: {}, results: {}, pub: {}, materials: {}, files: {} }; },
  save(d) { ls.set('examdemo2', JSON.stringify(d)); },
  isTeacher() { return !!ls.get('demoTeacher'); },
  async login(_e, pw) { if (pw === '1234') { ls.set('demoTeacher', '1'); return true; } return false; },
  async logout() { ls.del('demoTeacher'); },
  async listExams() { return Object.values(this.db().exams).sort((a, b) => b.createdAt - a.createdAt); },
  async listActiveExams() { return (await this.listExams()).filter(e => e.active); },
  async getExam(id) { return this.db().exams[id] || null; },
  async saveExam(exam, key) { const d = this.db(); d.exams[exam.id] = exam; d.keys[exam.id] = key; this.save(d); },
  async setActive(id, a) { const d = this.db(); if (d.exams[id]) d.exams[id].active = a; this.save(d); },
  async setFlags(id, o) { const d = this.db(); if (d.exams[id]) Object.assign(d.exams[id], o); this.save(d); },
  async getKey(id) { return this.db().keys[id] || null; },
  async deleteExam(id) { const d = this.db(); delete d.exams[id]; delete d.keys[id]; this.save(d); },
  async getStudent(code) { return this.db().students[code] || null; },
  async listStudents() { return Object.values(this.db().students).sort((a, b) => a.createdAt - b.createdAt); },
  async addStudents(arr) { const d = this.db(); arr.forEach(s => { d.students[s.code] = s; }); this.save(d); },
  async deleteStudent(code) { const d = this.db(); delete d.students[code]; delete d.pub[code]; this.save(d); },
  async getSettings() { return this.db().settings || {}; },
  async setRegistration(open) { const d = this.db(); d.settings = { ...(d.settings || {}), registrationOpen: !!open }; this.save(d); },
  async getPending(code) { return (this.db().pending || {})[code] || null; },
  async listPending() { return Object.values(this.db().pending || {}).sort((a, b) => a.createdAt - b.createdAt); },
  async createPending(p) { const d = this.db(); d.pending = d.pending || {}; d.pending[p.code] = p; this.save(d); },
  async rejectPending(code) { const d = this.db(); if (d.pending) delete d.pending[code]; this.save(d); },
  async approvePending(p) { const d = this.db(); d.students[p.code] = { code: p.code, name: p.name, createdAt: Date.now(), self: true }; if (d.pending) delete d.pending[p.code]; this.save(d); },
  async logLeave(id, n, away) { const d = this.db(); if (d.attempts[id]) { Object.assign(d.attempts[id], { leaves: n, lastLeave: Date.now(), away: !!away }); } this.save(d); },
  async listAttempts(examId) { return Object.values(this.db().attempts).filter(a => a.examId === examId); },
  async getAttempt(id) { return this.db().attempts[id] || null; },
  async createAttempt(id, data) { const d = this.db(); d.attempts[id] = { ...data, submitted: false, startedAt: Date.now() }; this.save(d); return d.attempts[id]; },
  async markSubmitted(id) { const d = this.db(); if (d.attempts[id]) d.attempts[id].submitted = true; this.save(d); },
  async saveResult(r) { const d = this.db(); d.results[r.id] = r; this.save(d); },
  async listResults(examId) { return Object.values(this.db().results).filter(r => r.examId === examId); },
  async deleteResult(r) { const d = this.db(); delete d.results[r.id]; delete d.attempts[r.id]; if (r.studentCode && d.pub[r.studentCode]) delete d.pub[r.studentCode][r.examId]; this.save(d); },
  async publishFor(docs) { const d = this.db(); docs.forEach(x => { (d.pub[x.code] = d.pub[x.code] || {})[x.examId] = x; }); this.save(d); },
  async unpublish(examId, codes) { const d = this.db(); codes.forEach(c => { if (d.pub[c]) delete d.pub[c][examId]; }); this.save(d); },
  async listPublished(code) { return Object.values(this.db().pub[code] || {}); },
  async listMaterials() { return Object.values(this.db().materials).sort((a, b) => b.createdAt - a.createdAt); },
  async addMaterial(m, data) { const d = this.db(); d.materials[m.id] = m; if (data) d.files[m.id] = data; this.save(d); },
  async deleteMaterial(id) { const d = this.db(); delete d.materials[id]; delete d.files[id]; this.save(d); },
  async getMaterialData(id) { return this.db().files[id] || null; }
};

/* ========= التخزين: Firebase (مجاني) ========= */
const FB = {
  async init() {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = base + f; s.onload = res; s.onerror = () => rej(new Error('تعذر تحميل Firebase، اتأكد من النت')); document.head.appendChild(s); });
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    this.db = firebase.firestore(); this.auth = firebase.auth();
    await new Promise(r => { const u = this.auth.onAuthStateChanged(() => { u(); r(); }); });
  },
  col(n) { return this.db.collection(n); },
  isTeacher() { return !!this.auth.currentUser; },
  async login(email, pw) { try { await this.auth.signInWithEmailAndPassword(email, pw); return true; } catch (e) { return false; } },
  async logout() { await this.auth.signOut(); },
  async listExams() { const s = await this.col('exams').orderBy('createdAt', 'desc').get(); return s.docs.map(d => d.data()); },
  async listActiveExams() { const s = await this.col('exams').where('active', '==', true).get(); return s.docs.map(d => d.data()).sort((a, b) => b.createdAt - a.createdAt); },
  async getExam(id) { const d = await this.col('exams').doc(id).get(); return d.exists ? d.data() : null; },
  async saveExam(exam, key) { const b = this.db.batch(); b.set(this.col('exams').doc(exam.id), exam); b.set(this.col('keys').doc(exam.id), key); await b.commit(); },
  setActive(id, a) { return this.col('exams').doc(id).update({ active: a }); },
  setFlags(id, o) { return this.col('exams').doc(id).update(o); },
  async getKey(id) { const d = await this.col('keys').doc(id).get(); return d.exists ? d.data() : null; },
  async deleteExam(id) { await this.col('exams').doc(id).delete(); await this.col('keys').doc(id).delete(); },
  async getStudent(code) { const d = await this.col('students').doc(code).get(); return d.exists ? d.data() : null; },
  async listStudents() { const s = await this.col('students').get(); return s.docs.map(d => d.data()).sort((a, b) => a.createdAt - b.createdAt); },
  async addStudents(arr) { for (let i = 0; i < arr.length; i += 400) { const b = this.db.batch(); arr.slice(i, i + 400).forEach(s => b.set(this.col('students').doc(s.code), s)); await b.commit(); } },
  async deleteStudent(code) {
    const sub = await this.col('students').doc(code).collection('results').get();
    if (!sub.empty) { const b = this.db.batch(); sub.docs.forEach(d => b.delete(d.ref)); await b.commit(); }
    await this.col('students').doc(code).delete();
  },
  async getSettings() { const d = await this.col('settings').doc('app').get(); return d.exists ? d.data() : {}; },
  setRegistration(open) { return this.col('settings').doc('app').set({ registrationOpen: !!open }, { merge: true }); },
  async getPending(code) { const d = await this.col('pending').doc(code).get(); return d.exists ? d.data() : null; },
  async listPending() { const s = await this.col('pending').get(); return s.docs.map(d => d.data()).sort((a, b) => a.createdAt - b.createdAt); },
  createPending(p) { return this.col('pending').doc(p.code).set(p); },
  rejectPending(code) { return this.col('pending').doc(code).delete(); },
  async approvePending(p) {
    const b = this.db.batch();
    b.set(this.col('students').doc(p.code), { code: p.code, name: p.name, createdAt: Date.now(), self: true });
    b.delete(this.col('pending').doc(p.code));
    await b.commit();
  },
  logLeave(id, n, away) { return this.col('attempts').doc(id).update({ leaves: n, lastLeave: Date.now(), away: !!away }); },
  async listAttempts(examId) {
    const s = await this.col('attempts').where('examId', '==', examId).get();
    return s.docs.map(d => { const x = d.data(); return { ...x, startedAt: x.startedAt && x.startedAt.toMillis ? x.startedAt.toMillis() : 0 }; });
  },
  async getAttempt(id) {
    const d = await this.col('attempts').doc(id).get(); if (!d.exists) return null;
    const x = d.data(); return { ...x, startedAt: x.startedAt && x.startedAt.toMillis ? x.startedAt.toMillis() : Date.now() };
  },
  async createAttempt(id, data) { await this.col('attempts').doc(id).set({ ...data, submitted: false, startedAt: firebase.firestore.FieldValue.serverTimestamp() }); return this.getAttempt(id); },
  async markSubmitted(id) { await this.col('attempts').doc(id).update({ submitted: true }); },
  async saveResult(r) { await this.col('results').doc(r.id).set(r); },
  async listResults(examId) { const s = await this.col('results').where('examId', '==', examId).get(); return s.docs.map(d => d.data()); },
  async deleteResult(r) {
    await this.col('results').doc(r.id).delete(); await this.col('attempts').doc(r.id).delete();
    if (r.studentCode) await this.col('students').doc(r.studentCode).collection('results').doc(r.examId).delete();
  },
  async publishFor(docs) { for (let i = 0; i < docs.length; i += 400) { const b = this.db.batch(); docs.slice(i, i + 400).forEach(x => b.set(this.col('students').doc(x.code).collection('results').doc(x.examId), x)); await b.commit(); } },
  async unpublish(examId, codes) { for (let i = 0; i < codes.length; i += 400) { const b = this.db.batch(); codes.slice(i, i + 400).forEach(c => b.delete(this.col('students').doc(c).collection('results').doc(examId))); await b.commit(); } },
  async listPublished(code) { const s = await this.col('students').doc(code).collection('results').get(); return s.docs.map(d => d.data()); },
  async listMaterials() { const s = await this.col('materials').orderBy('createdAt', 'desc').get(); return s.docs.map(d => d.data()); },
  async addMaterial(m, data) { const b = this.db.batch(); b.set(this.col('materials').doc(m.id), m); if (data) b.set(this.col('materialFiles').doc(m.id), { data }); await b.commit(); },
  async deleteMaterial(id) { await this.col('materials').doc(id).delete(); try { await this.col('materialFiles').doc(id).delete(); } catch (e) {} },
  async getMaterialData(id) { const d = await this.col('materialFiles').doc(id).get(); return d.exists ? d.data().data : null; }
};

/* ========= الهيكل العام ========= */
const S = { store: DEMO ? DemoStore : FB, timer: null };
const getSession = () => { try { return JSON.parse(ls.get('stu')); } catch (e) { return null; } };
const setSession = s => { if (s) ls.set('stu', JSON.stringify(s)); else ls.del('stu'); };
const themeBtn = '<button class="icon-btn" data-theme-toggle aria-label="تبديل الوضع الداكن"><span class="ic-moon">🌙</span><span class="ic-sun">☀️</span></button>';

function view(html) { $('#app').onclick = null; $('#app').innerHTML =(DEMO ? '<div class="banner">وضع تجريبي: البيانات محفوظة في المتصفح ده بس</div>' : '') + html; }
const topbar = (extra = '') => `<div class="top"><div class="logo"><i>🧬</i>د. أحمد الشرقاوي</div><span class="sp"></span>${extra}${themeBtn}</div>`;

function studentShell(tab, inner) {
  view(`${topbar('<button class="btn sm ghost" id="sout">خروج</button>')}<div class="wrap pb" id="main">${inner}</div>
  <nav class="nav"><a href="#s/exams" class="${tab === 'exams' ? 'on' : ''}"><b>📝</b>الامتحانات</a><a href="#s/results" class="${tab === 'results' ? 'on' : ''}"><b>📊</b>نتايجي</a><a href="#s/files" class="${tab === 'files' ? 'on' : ''}"><b>📚</b>الملفات</a></nav>`);
  $('#sout').onclick = () => { setSession(null); go('#'); };
}
function teacherShell(tab, inner) {
  view(`${topbar('<button class="btn sm ghost" id="out">خروج</button>')}<div class="wrap">
  <div class="tabs"><a href="#teacher" class="${tab === 'exams' ? 'on' : ''}">الامتحانات</a><a href="#teacher/students" class="${tab === 'students' ? 'on' : ''}">الطلاب</a><a href="#teacher/files" class="${tab === 'files' ? 'on' : ''}">الملفات</a></div>${inner}</div>`);
  $('#out').onclick = async () => { await S.store.logout(); go('#teacher'); };
}

function router() {
  clearInterval(S.timer);
  if (S.cleanup) { S.cleanup(); S.cleanup = null; }
  const p = location.hash.replace(/^#\/?/, '').split('/');
  if (p[0] === 'teacher') return teacherRoute(p);
  return studentRoute(p[0] === 's' ? p : ['s', 'exams']);
}

/* ========= واجهة الطالب ========= */
function studentLogin(note) {
  view(`${topbar()}<div class="wrap narrow"><div class="hero" style="margin-top:20px;text-align:center"><div style="font-size:2.4rem">🧬</div><h1>منصة د. أحمد الشرقاوي</h1><div>أحياء الثانوية العامة · سجّل دخولك بالكود الشخصي</div></div>
  <div class="card"><label for="cd">الكود الشخصي</label><input type="text" id="cd" dir="ltr" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:3px;text-align:center;font-size:1.2rem">
  <div id="msg">${note ? `<div class="msg bad">${esc(note)}</div>` : ''}</div><button class="btn block" id="go">دخول</button>
  <p class="muted" style="margin-bottom:0">أول مرة؟ <a href="#s/register">سجّل حساب جديد</a>.${DEMO ? ' للتجربة: DEMO01' : ''}</p></div>
  <p class="foot"><a href="#teacher">دخول المدرس</a></p></div>`);
  const login = async () => {
    const code = $('#cd').value.trim().toUpperCase().replace(/\s+/g, '');
    if (!code) return setMsg('اكتب الكود');
    const b = $('#go'); b.disabled = true; setMsg('');
    try {
      const st = await S.store.getStudent(code);
      if (!st) {
        const pd = await S.store.getPending(code);
        throw new Error(pd ? 'طلب التسجيل بتاعك لسه مستني موافقة المدرس. حاول تاني بعدين.' : 'الكود غلط');
      }
      setSession({ code, name: st.name }); go('#s/exams');
    } catch (e) { setMsg(e.message); b.disabled = false; }
  };
  $('#go').onclick = login; $('#cd').onkeydown = e => { if (e.key === 'Enter') login(); };
}

function studentRegister() {
  view(`${topbar()}<div class="wrap narrow"><h1>تسجيل حساب جديد</h1>
  <div class="card"><label for="rn">الاسم ثلاثي</label><input type="text" id="rn" autocomplete="name">
  <label for="rc">اختار كود الدخول بتاعك</label><input type="text" id="rc" dir="ltr" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:2px">
  <p class="muted" style="margin:4px 0">من 8 لـ 20 حرف إنجليزي وأرقام، ولازم يكون فيه حروف وأرقام مع بعض. اختار كود صعب التخمين ومتقولوش لحد، لأن أي حد يعرفه يقدر يدخل بحسابك.</p>
  <div id="msg"></div><button class="btn block" id="rg">إرسال الطلب</button></div>
  <p class="foot"><a href="#s/exams">رجوع لتسجيل الدخول</a></p></div>`);
  $('#rg').onclick = async () => {
    const name = $('#rn').value.trim().replace(/\s+/g, ' '), code = $('#rc').value.trim().toUpperCase();
    if (name.split(' ').length < 3 || name.length < 8 || name.length > 60) return setMsg('اكتب اسمك ثلاثي بالكامل');
    if (!/^[A-Z0-9]{8,20}$/.test(code) || !/[A-Z]/.test(code) || !/[0-9]/.test(code) || /(.)\1{3,}/.test(code)) return setMsg('الكود لازم 8 لـ 20 حرف وأرقام (إنجليزي) فيه حروف وأرقام، من غير تكرار حرف 4 مرات');
    const b = $('#rg'); b.disabled = true; setMsg('');
    try {
      const cfg = await S.store.getSettings();
      if (!cfg.registrationOpen) throw new Error('التسجيل مقفول دلوقتي. كلّم المدرس.');
      if ((await S.store.getStudent(code)) || (await S.store.getPending(code))) throw new Error('الكود ده مستخدم، اختار كود تاني.');
      await S.store.createPending({ code, name, createdAt: Date.now() });
      view(`${topbar()}<div class="wrap narrow"><div class="card" style="text-align:center"><div class="big">⏳</div><h2>تم إرسال طلبك</h2>
      <p class="muted">استنى لحد ما المدرس يقبل الطلب، وبعدين ادخل بنفس الكود.</p><a class="btn" href="#s/exams">رجوع لتسجيل الدخول</a></div></div>`);
    } catch (e) { b.disabled = false; setMsg(e.code === 'permission-denied' ? 'مقدرناش نبعت الطلب. التسجيل ممكن يكون اتقفل أو الكود مستخدم.' : e.message); }
  };
}

async function studentRoute(p) {
  if (p[1] === 'register') return studentRegister();
  const ses = getSession();
  if (!ses) return studentLogin();
  try {
    if (p[1] === 'exam' && p[2]) return await startExam(p[2], ses);
    if (p[1] === 'results') return await studentResults(ses);
    if (p[1] === 'files') return await studentFiles();
    return await studentExams(ses);
  } catch (e) { studentShell('exams', `<div class="msg bad">${esc(e.message)}</div>`); }
}

async function studentExams(ses) {
  studentShell('exams', loadingInner);
  const st = await S.store.getStudent(ses.code);
  if (!st) { setSession(null); return studentLogin('الكود ده مش متسجل. كلّم المدرس.'); }
  ses.name = st.name; setSession(ses);
  const exams = await S.store.listActiveExams();
  const atts = await Promise.all(exams.map(e => S.store.getAttempt(e.id + '_' + ses.code)));
  let pending = 0;
  const cards = exams.map((e, i) => {
    const a = atts[i];
    let badge = '<span class="badge">جديد</span>', btn = `<button class="btn sm" data-start="${e.id}" data-new="1">ابدأ الامتحان</button>`;
    if (a && a.submitted) { badge = '<span class="badge ok">تم التسليم ✓</span>'; btn = ''; }
    else {
      pending++;
      if (a) {
        const left = e.durationMin * 60 - Math.floor((Date.now() - a.startedAt) / 1000);
        if (left > 0) { badge = `<span class="badge warn">جاري · باقي ${Math.ceil(left / 60)} د</span>`; btn = `<button class="btn sm" data-start="${e.id}">كمّل الامتحان</button>`; }
        else { badge = '<span class="badge warn">انتهى الوقت</span>'; btn = `<button class="btn sm" data-start="${e.id}">تسليم إجاباتك</button>`; }
      }
    }
    return `<div class="card"><div class="row"><div class="grow"><b>${esc(e.title)}</b><div class="muted">${e.questions.length} سؤال · ${e.durationMin} دقيقة</div></div>${badge}</div>${btn ? `<div style="margin-top:10px">${btn}</div>` : ''}</div>`;
  });
  studentShell('exams', `<div class="hero"><div>أهلاً</div><h1>${esc(ses.name)}</h1><div>${pending ? `عندك ${pending} امتحان مفتوح` : 'مفيش امتحانات مطلوبة دلوقتي'}</div></div>
  <h2>الامتحانات المتاحة</h2>${cards.join('') || '<div class="card muted">مفيش امتحانات مفتوحة دلوقتي.</div>'}`);
  $('#main').onclick = e => {
    const b = e.target.closest('[data-start]'); if (!b) return;
    const ex = exams.find(x => x.id === b.dataset.start);
    if (b.dataset.new && !confirm(`المؤقت هيبدأ فورًا ومدته ${ex.durationMin} دقيقة. تبدأ؟`)) return;
    go('#s/exam/' + b.dataset.start);
  };
}

const draftKey = aid => 'draft_' + aid;
function loadDraft(aid, n) { try { const a = JSON.parse(ls.get(draftKey(aid))); if (Array.isArray(a) && a.length === n) return a; } catch (e) {} return Array(n).fill(-1); }
const saveDraft = (aid, a) => ls.set(draftKey(aid), JSON.stringify(a));

async function startExam(id, ses) {
  studentShell('exams', loadingInner);
  const exam = await S.store.getExam(id);
  if (!exam) throw new Error('الامتحان مش موجود');
  const aid = exam.id + '_' + ses.code;
  let att = await S.store.getAttempt(aid);
  if (att && att.submitted) throw new Error('انت سلّمت الامتحان ده قبل كده.');
  if (!att) {
    if (!exam.active) throw new Error('الامتحان مقفول دلوقتي');
    att = await S.store.createAttempt(aid, { examId: exam.id, studentCode: ses.code, name: ses.name });
  }
  const left = exam.durationMin * 60 - Math.floor((Date.now() - att.startedAt) / 1000);
  if (left <= 0) { await submitAnswers(exam, aid, ses, loadDraft(aid, exam.questions.length)); return doneScreen(true); }
  runExam(exam, aid, ses, att.startedAt, att.leaves || 0);
}

async function submitAnswers(exam, aid, ses, answers) {
  try { await S.store.saveResult({ id: aid, examId: exam.id, examTitle: exam.title, studentCode: ses.code, name: ses.name, answers, submittedAt: Date.now() }); }
  catch (e) { if (!(e && e.code === 'permission-denied')) throw e; }
  try { await S.store.markSubmitted(aid); } catch (e) {}
  ls.del(draftKey(aid));
}

function runExam(exam, aid, ses, startedAt, leaves0) {
  const r = rng(hashStr(aid)), idx = n => Array.from({ length: n }, (_, k) => k);
  let qs = exam.questions.map((q, i) => ({ q, i }));
  if (exam.shuffle) qs = shuffled(qs, r);
  qs.forEach(o => { o.order = exam.shuffle ? shuffled(idx(o.q.options.length), r) : idx(o.q.options.length); });
  const ans = loadDraft(aid, exam.questions.length);
  view(`<div class="xbar"><div class="xrow"><b>${esc(exam.title)}</b><span class="timer" id="tm">--:--</span></div><div class="prog"><i id="pg"></i></div></div>
  <div class="wrap" id="ex"><p class="muted">${esc(ses.name)} · <span id="cnt"></span></p>
  <div class="msg" id="lv" style="background:var(--warn-bg);color:var(--warn)"></div>
  ${qs.map((o, p) => `<div class="card q"><div class="qh"><span class="qn">${p + 1}</span>${esc(o.q.text)}</div>
    ${o.q.image ? `<img src="${esc(o.q.image)}" alt="">` : ''}
    ${o.order.map(k => `<label class="opt"><input type="radio" name="q${o.i}" data-i="${o.i}" value="${k}" ${ans[o.i] === k ? 'checked' : ''}><span>${esc(o.q.options[k])}</span></label>`).join('')}</div>`).join('')}
  <div id="msg"></div><button class="btn block" id="fin" style="margin-bottom:40px">تسليم الإجابات</button></div>`);
  const count = () => { const n = ans.filter(a => a >= 0).length; $('#cnt').textContent = `اتجاوب ${n} من ${ans.length}`; $('#pg').style.width = (ans.length ? n / ans.length * 100 : 0) + '%'; };
  count();
  $('#ex').onchange = e => { const t = e.target; if (t.type === 'radio') { ans[+t.dataset.i] = +t.value; saveDraft(aid, ans); count(); } };
  let busy = false;
  const finish = async auto => {
    busy = true; const b = $('#fin'); b.disabled = true; setMsg('');
    try { await submitAnswers(exam, aid, ses, ans); clearInterval(S.timer); if (S.cleanup) { S.cleanup(); S.cleanup = null; } doneScreen(auto); }
    catch (e) { busy = false; b.disabled = false; setMsg('تعذر الإرسال، اتأكد من النت وإضغط تسليم تاني. إجاباتك محفوظة.'); }
  };
  const tick = () => {
    const left = exam.durationMin * 60 - Math.floor((Date.now() - startedAt) / 1000), l = Math.max(0, left), tm = $('#tm');
    if (!tm) return;
    tm.textContent = pad(Math.floor(l / 60)) + ':' + pad(l % 60); tm.classList.toggle('low', l <= 60);
    if (left <= 0 && !busy) finish(true);
  };
  S.timer = setInterval(tick, 1000); tick();
  let leaves = leaves0;
  const showLv = () => { const el = $('#lv'); if (el) el.textContent = leaves ? `⚠ خروجك من صفحة الامتحان اتسجل ${leaves} مرة وبيظهر للمدرس.` : 'ملحوظة: الخروج من صفحة الامتحان بيتسجل وبيظهر للمدرس.'; };
  showLv();
  const onVis = () => {
    if (busy) return;
    if (document.hidden) { leaves++; S.store.logLeave(aid, leaves, true).catch(() => {}); }
    else { S.store.logLeave(aid, leaves, false).catch(() => {}); showLv(); }
  };
  document.addEventListener('visibilitychange', onVis);
  S.cleanup = () => document.removeEventListener('visibilitychange', onVis);
  $('#fin').onclick = () => {
    const un = ans.filter(a => a < 0).length;
    if (!confirm(un ? `لسه ${un} سؤال من غير إجابة. تسلّم برضه؟` : 'تسليم الإجابات؟')) return;
    finish(false);
  };
}

function doneScreen(timeUp) {
  studentShell('exams', `<div class="card" style="text-align:center"><div class="big">✅</div><h2>${timeUp ? 'الوقت خلص وإجاباتك اتسلمت' : 'تم تسليم إجاباتك'}</h2>
  <p class="muted">المدرس هينشر النتيجة، وهتلاقيها في تبويب "نتايجي".</p><a class="btn" href="#s/exams">رجوع للرئيسية</a></div>`);
}

async function studentResults(ses) {
  studentShell('results', loadingInner);
  const list = (await S.store.listPublished(ses.code)).sort((a, b) => (b.publishedAt || 0) - (a.publishedAt || 0));
  const pct = d => d.total ? Math.round(d.score / d.total * 100) : 0;
  const avg = list.length ? Math.round(list.reduce((s, d) => s + pct(d), 0) / list.length) : 0;
  studentShell('results', `<h2>نتايجي</h2>
  ${list.length ? `<div class="stat"><div><b>${list.length}</b>امتحانات</div><div><b>${avg}%</b>متوسطك</div></div>` : ''}
  ${list.length ? list.map((d, i) => `<div class="card click" data-i="${i}"><div class="row"><div class="ring" style="--p:${pct(d)}"><span>${pct(d)}%</span></div>
    <div class="grow"><b>${esc(d.examTitle)}</b><div class="muted">${d.score} من ${d.total}${d.publishedAt ? ' · ' + fmtDate(d.publishedAt) : ''}</div></div><span class="muted">‹</span></div></div>`).join('')
    : '<div class="card muted">لسه مفيش نتايج منشورة. هتظهر هنا لما المدرس ينشرها.</div>'}`);
  $('#main').onclick = e => { const c = e.target.closest('[data-i]'); if (c) resultDetail(list[+c.dataset.i], ses); };
}

function resultDetail(d, ses) {
  const pct = d.total ? Math.round(d.score / d.total * 100) : 0;
  studentShell('results', `<button class="btn sm ghost" id="back">→ رجوع</button>
  <div class="card" style="text-align:center"><div class="muted">${esc(d.examTitle)}</div><div class="ring lg" style="--p:${pct};margin:8px auto"><span>${pct}%</span></div><b>${d.score} من ${d.total}</b></div>
  ${d.items ? d.items.map((q, i) => `<div class="card q rv"><div class="qh"><span class="qn">${i + 1}</span>${esc(q.text)}</div>
    ${q.options.map((o, k) => `<div class="opt ${k === q.correct ? 'good' : (k === q.chosen ? 'wrong' : '')}"><span>${k === q.correct ? '✓' : (k === q.chosen ? '✗' : '•')}</span><span>${esc(o)}${k === q.chosen ? ' (إجابتك)' : ''}</span></div>`).join('')}
    ${q.chosen < 0 ? '<div class="muted">ما جاوبتش على السؤال ده</div>' : ''}</div>`).join('')
    : '<p class="muted" style="text-align:center">المدرس عرض الدرجة بس من غير تفاصيل الأسئلة.</p>'}`);
  $('#back').onclick = () => studentResults(ses);
}

const isHttp = u => /^https?:\/\/\S+$/i.test(u || '');
async function studentFiles() {
  studentShell('files', loadingInner);
  const list = await S.store.listMaterials();
  studentShell('files', `<h2>الملفات والمراجع</h2>${list.length ? list.map(m => `<div class="card"><div class="row"><span style="font-size:1.6rem">${m.kind === 'link' ? '🔗' : '📄'}</span>
    <div class="grow"><b>${esc(m.title)}</b>${m.desc ? `<div class="muted">${esc(m.desc)}</div>` : ''}<div class="muted" style="font-size:.8rem">${fmtDate(m.createdAt)}</div></div>
    ${m.kind === 'link' ? (isHttp(m.url) ? `<a class="btn sm" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">فتح</a>` : '') : `<button class="btn sm" data-dl="${m.id}">تحميل</button>`}</div></div>`).join('')
    : '<div class="card muted">لسه مفيش ملفات.</div>'}`);
  $('#main').onclick = async e => {
    const b = e.target.closest('[data-dl]'); if (!b) return;
    const m = list.find(x => x.id === b.dataset.dl); b.disabled = true;
    try {
      const data = await S.store.getMaterialData(m.id); if (!data) throw new Error('الملف مش موجود');
      const a = document.createElement('a'); a.href = data; a.download = m.fileName || 'file'; document.body.appendChild(a); a.click(); a.remove();
    } catch (er) { alert(er.message); }
    b.disabled = false;
  };
}

/* ========= واجهة المدرس ========= */
async function teacherRoute(p) {
  if (!S.store.isTeacher()) return teacherLogin();
  try {
    if (!p[1]) return await dashboard();
    if (p[1] === 'new') return await editor(null);
    if (p[1] === 'edit') return await editor(p[2]);
    if (p[1] === 'results') return await results(p[2]);
    if (p[1] === 'students') return await teacherStudents();
    if (p[1] === 'files') return await teacherFiles();
    await dashboard();
  } catch (e) { teacherShell('exams', `<div class="msg bad">${esc(e.message)}</div>`); }
}

function teacherLogin() {
  view(`${topbar()}<div class="wrap narrow"><h1>دخول المدرس</h1><div class="card">
  ${DEMO ? '' : '<label for="em">الإيميل</label><input type="email" id="em" dir="ltr">'}
  <label for="pw">${DEMO ? 'كلمة السر (للتجربة: 1234)' : 'كلمة السر'}</label><input type="password" id="pw" dir="ltr">
  <div id="msg"></div><button class="btn block" id="lg">دخول</button></div>
  <p class="foot"><a href="#">صفحة الطلاب</a></p></div>`);
  const login = async () => {
    const ok = await S.store.login(DEMO ? '' : $('#em').value.trim(), $('#pw').value);
    if (!ok) return setMsg('بيانات الدخول غلط');
    router();
  };
  $('#lg').onclick = login; $('#pw').onkeydown = e => { if (e.key === 'Enter') login(); };
}

async function dashboard() {
  teacherShell('exams', loadingInner);
  const exams = await S.store.listExams(), link = location.href.split('#')[0];
  teacherShell('exams', `<div id="dash"><div class="row"><h2 class="grow">امتحاناتي</h2><a class="btn" href="#teacher/new">+ امتحان جديد</a></div>
  <div class="card"><b>رابط الطلاب</b><div class="row" style="margin-top:6px"><span class="code grow" style="font-size:.8rem;letter-spacing:0;word-break:break-all">${esc(link)}</span><button class="btn sm ghost" id="cp">نسخ</button></div></div>
  ${exams.length ? exams.map(e => `<div class="card"><div class="row"><div class="grow"><b>${esc(e.title)}</b><div class="muted">${e.questions.length} سؤال · ${e.durationMin} دقيقة</div></div>${e.published ? '<span class="badge ok">النتايج منشورة</span>' : ''}</div>
  <div class="row" style="margin-top:10px"><label class="row" style="margin:0;font-weight:400"><input type="checkbox" data-act="active" data-id="${e.id}" ${e.active ? 'checked' : ''}> مفتوح للطلاب</label><span class="grow"></span>
  <a class="btn sm" href="#teacher/results/${e.id}">النتائج</a><a class="btn sm ghost" href="#teacher/edit/${e.id}">تعديل</a><button class="btn sm danger" data-act="del" data-id="${e.id}">حذف</button></div></div>`).join('') : '<div class="card muted">لسه مفيش امتحانات. اضغط "امتحان جديد".</div>'}</div>`);
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(link); $('#cp').textContent = 'تم'; } catch (e) { prompt('انسخ الرابط:', link); } };
  const root = $('#dash');
  root.onchange = async e => { const t = e.target; if (t.dataset.act === 'active') { try { await S.store.setActive(t.dataset.id, t.checked); } catch (er) { t.checked = !t.checked; alert(er.message); } } };
  root.onclick = async e => {

/* ----- محرر الامتحان ----- */
const newQ = () => ({ text: '', image: '', options: ['', '', '', ''], correct: 0 });

/*PARSE_START*/
const AR_IDX = { 'أ': 0, 'ا': 0, 'إ': 0, 'آ': 0, 'ب': 1, 'ج': 2, 'د': 3, 'ه': 4, 'هـ': 4 };
function letterIdx(c) {
  c = String(c).trim();
  if (c in AR_IDX) return AR_IDX[c];
  const l = c.toLowerCase();
  return /^[a-e]$/.test(l) ? l.charCodeAt(0) - 97 : -1;
}
function parseQuestions(raw) {
  const L = 'هـ|[أاإآبجدهa-eA-E]';
  const lines = String(raw).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\r/g, '').split('\n')
    .map(s => s.replace(/[‎‏‪-‮؜]/g, '').trim()).filter(Boolean);
  const reAns = new RegExp('^(?:الإجابة|الاجابة|الإجابه|الاجابه|الحل|answer|ans)\\s*(?:الصحيحة|الصحيحه)?\\s*[:：\\-–]?\\s*\\(?\\s*(' + L + ')\\s*\\)?\\s*$', 'i');
  const reOpt = new RegExp('^[\\(\\[]?\\s*(' + L + ')\\s*[\\)\\]\\.\\-–:]\\s*(.+)$');
  const reQ = /^(?:(?:السؤال|سؤال|س)\s*)?(\d{1,3})\s*[\)\.\-–:ـ]\s*(.+)$/;
  const reQ2 = /^(?:السؤال|سؤال|س)\s*[:\-–]\s*(.+)$/;
  const reKeyHead = /^(?:مفتاح\s+)?(?:الإجابات|الاجابات|نموذج الإجابة|نموذج الاجابة|answers?|key)\s*[:：]?\s*$/i;
  const pairSrc = '(\\d{1,3})\\s*[-–:\\)\\.]\\s*(' + L + ')(?![\\u0621-\\u064Aa-zA-Z])';
  const qs = [], key = {};
  let cur = null, inKey = false;
  for (const ln of lines) {
    if (qs.length && reKeyHead.test(ln)) { inKey = true; cur = null; continue; }
    const pairs = [...ln.matchAll(new RegExp(pairSrc, 'g'))];
    if (inKey || (pairs.length >= 2 && ln.replace(new RegExp(pairSrc, 'g'), '').replace(/[\s,،;]/g, '') === '')) {
      for (const p of pairs) key[+p[1]] = letterIdx(p[2]);
      if (pairs.length) { inKey = true; cur = null; }
      continue;
    }
    let m;
    if (cur && (m = ln.match(reAns))) { cur.correct = letterIdx(m[1]); continue; }
    if (cur && (m = ln.match(reOpt))) {
      let t = m[2].trim(), ok = false;
      if (/[✓✔√]\s*$/.test(t) || /^\*/.test(t)) { ok = true; t = t.replace(/[✓✔√]\s*$/, '').replace(/^\*\s*/, '').trim(); }
      const idx = cur.options.push(t) - 1; if (ok) cur.correct = idx;
      continue;
    }
    if ((m = ln.match(reQ))) { cur = { num: +m[1], text: m[2].trim(), options: [], correct: -1 }; qs.push(cur); continue; }
    if ((m = ln.match(reQ2))) { cur = { num: qs.length + 1, text: m[1].trim(), options: [], correct: -1 }; qs.push(cur); continue; }
    if (cur) { if (cur.options.length) cur.options[cur.options.length - 1] += ' ' + ln; else cur.text += ' ' + ln; }
  }
  const valid = [];
  let skipped = 0;
  for (const q of qs) {
    if (q.correct < 0 && key[q.num] !== undefined) q.correct = key[q.num];
    if (q.options.length < 2) { skipped++; continue; }
    if (q.correct < 0 || q.correct >= q.options.length) q.correct = -1;
    valid.push(q);
  }
  return { valid, skipped };
}
/*PARSE_END*/

let pdfjsP = null;
function loadPdfJs() {
  if (pdfjsP) return pdfjsP;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  pdfjsP = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = base + 'pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror = () => { pdfjsP = null; rej(new Error('تعذر تحميل قارئ PDF، اتأكد من النت')); };
    document.head.appendChild(s);
  });
  return pdfjsP;
}
async function pdfToText(file) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    let line = '', lastY = null;
    for (const it of tc.items) {
      const y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 4) { out.push(line.trim()); line = ''; }
      line += it.str; lastY = y;
      if (it.hasEOL) { out.push(line.trim()); line = ''; lastY = null; }
    }
    out.push(line.trim());
  }
  return out.filter(Boolean).join('\n');
}

    if (ex.questions.length === 1 && !ex.questions[0].text.trim() && ex.questions[0].options.every(o => !o.trim())) ex.questions = [];
    valid.forEach(q => ex.questions.push({ text: q.text, image: '', options: q.options, correct: q.correct }));
    const noAns = valid.filter(q => q.correct < 0).length;
    redraw();
    const note = `تمت إضافة ${valid.length} سؤال.` + (noAns ? ` ${noAns} منهم من غير إجابة صحيحة محددة، حددها بنفسك.` : '') + (skipped ? ` ${skipped} اتتخطوا لأن اختياراتهم أقل من اتنين.` : '') + ' راجع كل الأسئلة قبل الحفظ.';
    $('#ed').insertAdjacentHTML('afterbegin', `<div class="msg ${noAns || skipped ? 'bad' : 'ok'}">${esc(note)}</div>`);
    window.scrollTo(0, 0);
  };
}

function qEditor(q, i) {
  return `<div class="card"><div class="row"><b class="grow">سؤال ${i + 1}</b><button class="btn sm danger" data-act="delq" data-q="${i}">حذف السؤال</button></div>

    : `<label style="font-weight:400" class="muted">صورة (اختياري): <input type="file" accept="image/*" data-q="${i}" data-f="img"></label>`}
  ${q.correct < 0 ? '<div class="msg bad" style="padding:4px 10px;margin:8px 0 4px">حدد الإجابة الصحيحة بالدايرة</div>' : '<div class="muted" style="margin-top:8px">حدد الإجابة الصحيحة بالدايرة</div>'}
  ${q.options.map((o, k) => `<div class="row" style="margin:6px 0"><input type="radio" name="c${i}" data-q="${i}" data-f="correct" value="${k}" ${q.correct === k ? 'checked' : ''}>
    <input class="grow" type="text" data-q="${i}" data-o="${k}" value="${esc(o)}" placeholder="اختيار ${k + 1}">
    ${q.options.length > 2 ? `<button class="btn sm danger" data-act="delo" data-q="${i}" data-o="${k}">×</button>` : ''}</div>`).join('')}
  <button class="btn sm ghost" data-act="addo" data-q="${i}">+ اختيار</button></div>`;
}

function drawEditor(ex, isEdit) {
  const y = window.scrollY;
  teacherShell('exams', `<div id="ed"><h2>${isEdit ? 'تعديل الامتحان' : 'امتحان جديد'}</h2>
  <div class="card"><label>عنوان الامتحان</label><input type="text" data-k="title" value="${esc(ex.title)}">
  <label>المدة (بالدقايق)</label><input type="number" min="1" data-k="durationMin" value="${ex.durationMin}">
  <label class="row" style="font-weight:400"><input type="checkbox" data-k="shuffle" ${ex.shuffle ? 'checked' : ''}> ترتيب الأسئلة والاختيارات عشوائي لكل طالب</label>
  <label class="row" style="font-weight:400"><input type="checkbox" data-k="active" ${ex.active ? 'checked' : ''}> مفتوح للطلاب</label></div>
  <div class="row"><button class="btn ghost" data-act="import">📥 استيراد أسئلة من PDF أو نص</button></div><div id="impHost"></div>
  ${ex.questions.map(qEditor).join('')}
  <div class="row"><button class="btn ghost" data-act="addq">+ سؤال</button><span class="grow"></span><button class="btn" data-act="save">حفظ الامتحان</button></div><div id="msg"></div></div>`);
  window.scrollTo(0, y);
  const root = $('#ed'), redraw = () => drawEditor(ex, isEdit);
  root.oninput = e => {
    const t = e.target, d = t.dataset;
    if (d.k) { if (t.type !== 'checkbox') ex[d.k] = t.type === 'number' ? Number(t.value) : t.value; }
    else if (d.q !== undefined) { const q = ex.questions[+d.q]; if (d.o !== undefined) q.options[+d.o] = t.value; else if (d.f === 'text') q.text = t.value; }
  };
  root.onchange = async e => {
    const t = e.target, d = t.dataset;
    if (d.k && t.type === 'checkbox') ex[d.k] = t.checked;
    else if (d.f === 'correct') ex.questions[+d.q].correct = +t.value;
    else if (d.f === 'img' && t.files[0]) { try { ex.questions[+d.q].image = await compress(t.files[0]); redraw(); } catch (er) { setMsg(er.message); } }
  };
  root.onclick = async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const d = b.dataset, a = d.act, q = ex.questions[+d.q];
    if (a === 'addq') { ex.questions.push(newQ()); redraw(); window.scrollTo(0, document.body.scrollHeight); }
    else if (a === 'delq') { if (ex.questions.length > 1 && confirm('حذف السؤال؟')) { ex.questions.splice(+d.q, 1); redraw(); } }
    else if (a === 'addo') { q.options.push(''); redraw(); }
    else if (a === 'delo') { q.options.splice(+d.o, 1); if (q.correct === +d.o) q.correct = 0; else if (q.correct > +d.o) q.correct--; redraw(); }
    else if (a === 'rmimg') { q.image = ''; redraw(); }
    else if (a === 'import') openImport(ex, redraw);
    else if (a === 'save') await saveEditor(ex, b);
  };
}

async function saveEditor(ex, btn) {
  const err = m => { setMsg(m); };
  if (!ex.title.trim()) return err('اكتب عنوان الامتحان');
  if (!(ex.durationMin >= 1)) return err('المدة لازم تكون دقيقة على الأقل');
  for (const [i, q] of ex.questions.entries()) {
    if (!q.text.trim()) return err(`سؤال ${i + 1}: اكتب نص السؤال`);
    if (q.options.some(o => !o.trim())) return err(`سؤال ${i + 1}: فيه اختيار فاضي (املاه أو احذفه)`);
    if (!(q.correct >= 0 && q.correct < q.options.length)) return err(`سؤال ${i + 1}: حدد الإجابة الصحيحة`);
  }
  const exam = { id: ex.id, title: ex.title.trim(), durationMin: Math.round(ex.durationMin), shuffle: !!ex.shuffle, active: !!ex.active, createdAt: ex.createdAt, published: !!ex.published, showAnswers: ex.showAnswers !== false,
    questions: ex.questions.map(q => ({ text: q.text.trim(), image: q.image || '', options: q.options.map(o => o.trim()) })) };
  const key = { answers: ex.questions.map(q => q.correct) };
  if (new Blob([JSON.stringify(exam)]).size > 800000) return err('حجم الامتحان كبير (غالبًا من الصور). قلل الصور أو الأسئلة.');
  btn.disabled = true; setMsg('');
  try { await S.store.saveExam(exam, key); go('#teacher'); }
  catch (e) { btn.disabled = false; setMsg(e.message); }
}

/* ----- النتائج ----- */
async function results(id) {
  if (S.cleanup) { S.cleanup(); S.cleanup = null; }
  teacherShell('exams', loadingInner);
  const [exams, key, rs, atts] = await Promise.all([S.store.listExams(), S.store.getKey(id), S.store.listResults(id), S.store.listAttempts(id)]);
  const ex = exams.find(e => e.id === id);
  if (!ex || !key) throw new Error('مش لاقي الامتحان');
  const total = ex.questions.length, pct = s => total ? Math.round(s / total * 100) : 0;
  const attMap = {}; atts.forEach(a => { if (a.studentCode) attMap[a.examId + '_' + a.studentCode] = a; });
  const rows = rs.map(r => ({ ...r, leaves: (attMap[r.id] || {}).leaves || 0, score: r.answers.reduce((s, a, i) => s + (a === key.answers[i] ? 1 : 0), 0) }))
    .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, 'ar'));
  const avg = rows.length ? Math.round(rows.reduce((s, r) => s + pct(r.score), 0) / rows.length) : 0;
  teacherShell('exams', `<div id="rs"><a href="#teacher">→ رجوع</a><h2>${esc(ex.title)}</h2>
  <div class="stat"><div><b>${rows.length}</b>سلّموا</div><div><b>${avg}%</b>المتوسط</div><div><b>${rows.length ? pct(rows[0].score) + '%' : '-'}</b>الأعلى</div><div><b>${rows.length ? pct(rows[rows.length - 1].score) + '%' : '-'}</b>الأقل</div></div>
  <div class="card" id="live"></div>
  <div class="card"><b>نشر النتائج للطلاب</b>
  <p class="muted" style="margin:4px 0">${ex.published ? 'النتائج منشورة حاليًا، والطالب بيشوفها في تبويب "نتايجي".' : 'النتائج مخفية عن الطلاب.'}</p>
  <label class="row" style="font-weight:400"><input type="checkbox" id="showAns" ${ex.showAnswers !== false ? 'checked' : ''}> أظهر للطالب الأسئلة والإجابات الصحيحة وإجاباته</label>
  <div class="row" style="margin-top:8px"><button class="btn" id="pub" ${rows.length ? '' : 'disabled'}>${ex.published ? 'تحديث النشر' : 'نشر النتائج'}</button>${ex.published ? '<button class="btn danger" id="unpub">إخفاء النتائج</button>' : ''}</div><div id="msg"></div>
  <p class="muted" style="font-size:.85rem;margin:6px 0 0">لو حد سلّم بعد النشر اضغط "تحديث النشر".</p></div>
  <div class="card"><div class="row"><b class="grow">الدرجات</b><button class="btn sm" id="csv" ${rows.length ? '' : 'disabled'}>تصدير Excel/CSV</button></div>
  ${rows.length ? `<div class="tbl"><table><tr><th>#</th><th>الاسم</th><th>الدرجة</th><th>%</th><th>وقت التسليم</th><th>الخروج من الصفحة</th><th></th></tr>
  ${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.score}/${total}</td><td>${pct(r.score)}%</td><td>${fmtDate(r.submittedAt)}</td><td>${r.leaves ? `<span class="badge warn">⚠ خرج ${r.leaves} مرة</span>` : '<span class="muted">—</span>'}</td><td><button class="btn sm danger" data-id="${esc(r.id)}">إعادة</button></td></tr>`).join('')}</table></div>
  <p class="muted" style="font-size:.85rem">زر "إعادة" بيمسح نتيجة الطالب وبيسمحله يمتحن تاني.</p>` : '<p class="muted">لسه محدش سلّم.</p>'}</div>
  ${rows.length ? `<div class="card"><b>نسبة الإجابة الصحيحة لكل سؤال</b>${ex.questions.map((q, i) => { const ok = rows.filter(r => r.answers[i] === key.answers[i]).length; return `<div class="row" style="margin-top:6px"><span class="muted grow">${i + 1}. ${esc(q.text.slice(0, 70))}</span><b>${Math.round(ok / rows.length * 100)}%</b></div>`; }).join('')}</div>` : ''}</div>`);
  const drawLive = list => {
    const el = $('#live'); if (!el) return false;
    const ing = list.filter(a => !a.submitted).sort((a, b) => (b.away ? 1 : 0) - (a.away ? 1 : 0) || String(a.name).localeCompare(b.name, 'ar'));
    el.innerHTML = `<div class="row"><b class="grow">جاري الامتحان الآن (${ing.length})</b><span class="muted" style="font-size:.8rem">بيتحدث تلقائيًا</span></div>` +
      (ing.length ? ing.map(a => {
        const over = a.startedAt && (Date.now() - a.startedAt) / 60000 > ex.durationMin + 2;
        return `<div class="row" style="margin-top:6px"><span class="grow">${esc(a.name)}</span>${a.away && !over ? '<span class="badge warn">🔴 خارج الصفحة الآن</span>' : ''}${a.leaves ? `<span class="badge warn">⚠ خرج ${a.leaves} مرة</span>` : ''}${over ? '<span class="badge">انتهى وقته ولم يسلّم</span>' : ''}</div>`;
      }).join('') : '<p class="muted" style="margin:6px 0 0">مفيش حد بيمتحن دلوقتي.</p>');
    return true;
  };
  drawLive(atts);
  const liveIv = setInterval(async () => {
    if (!$('#live')) return clearInterval(liveIv);
    try { drawLive(await S.store.listAttempts(id)); } catch (e) {}
  }, 20000);
  S.cleanup = () => clearInterval(liveIv);
  const csv = $('#csv');
  if (csv) csv.onclick = () => {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [['الاسم', 'الدرجة', 'من', 'النسبة', 'وقت التسليم', 'مرات الخروج'].map(q).join(',')]
      .concat(rows.map(r => [r.name, r.score, total, pct(r.score) + '%', fmtDate(r.submittedAt), r.leaves].map(q).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
    a.download = 'results.csv'; a.click();
  };
  const pub = $('#pub');
  if (pub) pub.onclick = async () => {
    const show = $('#showAns').checked;
    if (!confirm('نشر النتائج للطلاب دلوقتي؟')) return;
    pub.disabled = true;
    try {
      const now = Date.now();
      const docs = rows.filter(r => r.studentCode).map(r => ({ code: r.studentCode, examId: id, examTitle: ex.title, name: r.name, score: r.score, total, publishedAt: now,
        items: show ? ex.questions.map((q, i) => ({ text: q.text, options: q.options, chosen: r.answers[i] ?? -1, correct: key.answers[i] })) : null }));
      await S.store.publishFor(docs);
      await S.store.setFlags(id, { published: true, showAnswers: show });
      results(id);
    } catch (e) { pub.disabled = false; setMsg(e.message); }
  };
  const unpub = $('#unpub');
  if (unpub) unpub.onclick = async () => {
    if (!confirm('إخفاء النتائج عن الطلاب؟')) return;
    try { await S.store.unpublish(id, rows.map(r => r.studentCode).filter(Boolean)); await S.store.setFlags(id, { published: false }); results(id); } catch (e) { setMsg(e.message); }
  };
  $('#rs').onclick = async e => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    const r = rows.find(x => x.id === b.dataset.id);
    if (!confirm(`مسح نتيجة "${r.name}" والسماح له يمتحن تاني؟`)) return;
    try { await S.store.deleteResult(r); results(id); } catch (er) { setMsg(er.message); }
  };
}

/* ========= تشغيل ========= */
(async function boot() {
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-theme-toggle]')) return;
    const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = n; ls.set('theme', n);
  });
  try { if (!DEMO) await FB.init(); }
  catch (e) { view(`<div class="wrap narrow"><div class="msg bad">${esc(e.message)}</div></div>`); return; }
  if (DEMO && !(await DemoStore.listExams()).length) {
    await DemoStore.addStudents([{ code: 'DEMO01', name: 'طالب تجريبي', createdAt: Date.now() }]);
    await DemoStore.setRegistration(true);
    await DemoStore.saveExam({ id: 'demo1', title: 'امتحان تجريبي - أحياء', durationMin: 5, shuffle: true, active: true, createdAt: Date.now(), questions: [
      { text: 'أي عضية مسؤولة عن إنتاج الطاقة (ATP) في الخلية؟', image: '', options: ['الميتوكوندريا', 'الريبوسوم', 'جهاز جولجي', 'الليسوسوم'] },
      { text: 'الشريط المكمل للشريط AATGC في جزيء DNA هو:', image: '', options: ['TTACG', 'UUACG', 'CCGTA', 'AATGC'] },
      { text: 'في أي طور من الانقسام الميتوزي تصطف الكروموسومات على خط الاستواء؟', image: '', options: ['الطور التمهيدي', 'الطور الاستوائي', 'الطور الانفصالي', 'الطور النهائي'] }
    ] }, { answers: [0, 0, 1] });
  }
  window.addEventListener('hashchange', router);
  router();
})();
</script>
